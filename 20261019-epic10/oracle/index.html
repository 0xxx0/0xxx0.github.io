<style>
:root{
  --pad:rgb(8,12,18);
  --ink:rgb(79,87,96);
  --val:rgb(139,147,157);
  --txt:rgb(168,176,186);
  --acc:rgb(214,170,92);
  --fnt:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;
}
*{box-sizing:border-box}
html{background:var(--pad);color-scheme:dark}
body{margin:0;background:var(--pad);color:var(--val);font-family:var(--fnt);font-size:12px;line-height:1.5;-webkit-text-size-adjust:100%}
.inst{max-width:520px;margin:0 auto;padding:14px 12px 22px}
/* header */
.hd{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
/* input field */
.field{margin-top:15px}
.lab{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
textarea#obj{display:block;width:100%;min-height:76px;padding:8px 9px;background:rgb(11,16,23);border:1px solid rgba(79,87,96,.34);border-radius:2px;color:var(--txt);font-family:var(--fnt);font-size:16px;line-height:1.45;resize:vertical}
textarea#obj::placeholder{color:rgb(79,87,96)}
textarea#obj:focus{outline:none;border-color:rgba(139,147,157,.75)}
/* hash readout — encodes the derivation */
.src{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.src b{font-weight:normal;color:var(--val)}
/* sample row */
.chips{display:flex;gap:3px;margin-top:11px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:none;border:1px solid rgba(79,87,96,.4);border-radius:2px;color:var(--ink);font-family:var(--fnt);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:5px;white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:rgba(139,147,157,.85);color:var(--val);background:rgba(79,87,96,.16)}
.chips button:hover{border-color:rgba(139,147,157,.7)}
.chips button:focus-visible{outline:1px solid var(--val);outline-offset:1px}

.reveal{
  --pl:rgb(79,87,96);--ln:rgb(79,87,96);--vl:rgb(139,147,157);--mk:rgb(139,147,157);--d:.12;
  margin-top:15px;padding:12px 2px 11px;outline:none;cursor:pointer;
  border-top:1px solid rgba(79,87,96,.25);border-bottom:1px solid rgba(79,87,96,.25);

}
.reveal:hover,.reveal:focus,.reveal:focus-within,.reveal.bloom{
  --pl:rgb(150,158,168);--ln:rgb(176,185,195);--vl:rgb(214,221,229);--mk:rgb(214,170,92);--d:1;

.mlab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pl);transition:color .25s ease}

.stage{display:flex;justify-content:center;margin-top:9px}
.lines{width:min(300px,100%);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.pos{flex:0 0 14px;font-size:9.5px;color:var(--pl);text-align:right;transition:color .25s ease}
.bar{flex:1;display:flex;height:11px}
.bar i{display:block;background:var(--ln);transition:background-color .25s ease}
.bar.yang i{flex:1 1 100%}
.bar.yin{gap:30%}
.bar.yin i{flex:1 1 0}
.mark{flex:0 0 12px;font-size:11px;line-height:1;text-align:center;color:var(--mk);transition:color .25s ease}

.zh{font-size:23px;line-height:1.15;color:var(--vl);transition:color .25s ease}
.py{font-size:13px;color:var(--txt)}
.idx{font-size:9.5px;letter-spacing:.1em;color:var(--pl);transition:color .25s ease}
.en{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}

.panel{margin-top:13px;padding-top:9px;border-top:1px dashed rgba(79,87,96,.3)}
.prow{display:flex;gap:9px;align-items:baseline;margin-top:8px}
.prow:first-child{margin-top:0}
.plab{flex:0 0 88px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--pl);transition:color .25s ease}
.ptext{flex:1;min-width:0;margin:0;font-size:13.5px;line-height:1.55;color:var(--txt);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;

.ft{margin-top:13px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* depth without motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

</main>

<script id="core">
/* L1 ORACLE CORE — deterministic content-hash -> hexagram encoding.

var ORACLE = (function () {
  'use strict';
  var BASIS = 0x811c9dc5, PRIME = 0x01000193;

  /* UTF-8 bytes of a JS string (lone surrogates -> EF BF BD, like TextEncoder) */
  function utf8(str) {
    var out = [], i = 0, c, c2, cp;
    for (; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) { out.push(c); }
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c >= 0xd800 && c <= 0xdbff) {
        c2 = str.charCodeAt(i + 1);
        if (c2 >= 0xdc00 && c2 <= 0xdfff) {
          cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00); i++;
          out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        } else { out.push(0xef, 0xbf, 0xbd); }
      }
      else if (c >= 0xdc00 && c <= 0xdfff) { out.push(0xef, 0xbf, 0xbd); }
      else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }

  /* canonical FNV-1a 32-bit over a byte array */
  function fnv1a32(bytes) {
    var h = BASIS, i = 0;
    for (; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, PRIME); }
    return h >>> 0;
  }

  /* hash of a text object = FNV-1a of its exact UTF-8 bytes */
  function hash32(text) { return fnv1a32(utf8(String(text))); }

  /* second pure FNV-1a pass over the 4 little-endian bytes of the first digest:

  function rehash32(h) { return fnv1a32([h & 255, (h >>> 8) & 255, (h >>> 16) & 255, (h >>> 24) & 255]); }

      yang = ((bits >>> j) & 1) === 1;        /* bit j = line j+1 (line 1 at bottom) */
      pat += yang ? '1' : '0';
      pair = (h2 >>> (30 - 2 * j)) & 3;       /* one bit-pair of the rehash per line */
      lines.push({ n: j + 1, yang: yang, changing: pair === 0 });  /* P(change)=1/4 per line */
      if (pair === 0) { changing.push(j + 1); }
    }
    var g = BY_PAT[pat];
    if (changing.length) {
      var bp = pat.split(''), k;
      for (j = 0; j < changing.length; j++) {
        k = changing[j] - 1;
        bp[k] = bp[k] === '1' ? '0' : '1';
      }
      target = BY_PAT[bp.join('')] || null;
    }
    return {
      text: text, bytes: bytes.length, h1: h1, h2: h2, bits: bits, pattern: pat,
      id: g[0], gua: g, lines: lines, changing: changing,
      lower: TRI[pat.substring(0, 3)], upper: TRI[pat.substring(3, 6)],
      target: target
    };
  }

  var CORE = {
    version: 'L1-ORACLE-1', utf8: utf8, fnv1a32: fnv1a32, hash32: hash32, rehash32: rehash32,
    TRI: TRI, GUA: GUA, SAMPLES: SAMPLES, encode: encode
  };
  if (typeof module === 'object' && module && module.exports) { module.exports = CORE; }
  return CORE;
}());
</script>

<script>
/* L1 ORACLE — view layer. draws the record; quiet at rest, bloom on hover/focus/tap. */
(function () {
  'use strict';
  if (typeof document === 'undefined') { return; }
  var O = ORACLE;
  var POS = ['初', '二', '三', '四', '五', '上'];
  var $ = function (id) { return document.getElementById(id); };
  var obj = $('obj'), linesEl = $('lines'), reveal = $('reveal'), chipsEl = $('chips');

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (txt !== undefined) { e.textContent = txt; }
    return e;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function triSpan(k, tri) {
    var s = el('span');
    s.appendChild(el('i', 'k', k));
    s.appendChild(document.createTextNode(' ' + tri[0] + ' ' + tri[1] + ' ' + tri[2]));
    return s;
  }

  function render(text) {
    var r = O.encode(text), n;

    /* derivation readout */
    $('h8').textContent = ('00000000' + r.h1.toString(16)).slice(-8);
    $('bits').textContent = r.pattern;
    $('chg').textContent = r.changing.length + '/6';
    $('len').textContent = r.bytes + 'B' + (text === '' ? ' EMPTY' : '');

    /* draw 6 lines, DOM order line6 -> line1; divider at the trigram boundary */
    clear(linesEl);
    for (n = 6; n >= 1; n--) {
      if (n === 4) { linesEl.appendChild(el('div', 'split')); }
      var L = r.lines[n - 1];
      var row = el('div', 'row');
      row.appendChild(el('span', 'pos', POS[n - 1]));
      var bar = el('span', 'bar ' + (L.yang ? 'yang' : 'yin'));
      bar.appendChild(el('i'));
      if (!L.yang) { bar.appendChild(el('i')); }
      row.appendChild(bar);
      var mk = el('span', 'mark');
      if (L.changing) { mk.textContent = L.yang ? '×' : '○'; mk.title = 'changing line — old ' + (L.yang ? 'yang' : 'yin'); }
      row.appendChild(mk);
      linesEl.appendChild(row);
    }

    /* trigram pair: 上 upper first, 下 lower second */
    clear($('pair'));
    $('pair').appendChild(triSpan('上 UPPER', r.upper));
    $('pair').appendChild(triSpan('下 LOWER', r.lower));

    /* 64-gua name */
    var g = r.gua;
    clear($('gname'));
    $('gname').appendChild(el('span', 'gly', g[2]));
    $('gname').appendChild(el('span', 'zh', g[3]));
    $('gname').appendChild(el('span', 'py', g[4]));
    $('gname').appendChild(el('span', 'idx', ('0' + g[0]).slice(-2) + '/64'));
    $('gname').appendChild(el('span', 'en', g[5]));

    /* reading panel: classical line + ability-to-use line (+ transformation) */
    $('judg').textContent = g[6];
    $('use').textContent = g[7];
    if (r.target) {
      $('opensRow').style.display = '';
      $('opens').textContent = ('0' + r.target[0]).slice(-2) + ' ' + r.target[2] + r.target[3] +
        ' ' + r.target[4] + ' ' + r.target[5];
    } else {
      $('opensRow').style.display = 'none';
    }
  }

  function mark(i) {
    var bs = chipsEl.querySelectorAll('button'), k;
    for (k = 0; k < bs.length; k++) { bs[k].setAttribute('aria-pressed', k === i ? 'true' : 'false'); }
  }

  O.SAMPLES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = ('0' + (i + 1)).slice(-2) + ' ' + s.l;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      obj.value = s.t;
      mark(i);
      render(s.t);
      reveal.classList.add('bloom');   /* explicit tap = explicit reveal; tap outside returns to quiet */
    });
    chipsEl.appendChild(b);
  });

  obj.addEventListener('input', function () { mark(-1); render(obj.value); });

  reveal.addEventListener('click', function () { reveal.classList.toggle('bloom'); });
  reveal.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { reveal.classList.remove('bloom'); reveal.blur(); }
  });
  document.addEventListener('click', function (e) {
    if (!reveal.contains(e.target) && !chipsEl.contains(e.target)) { reveal.classList.remove('bloom'); }
  });

  /* initial state: first sample drawn, at rest quiet */
  obj.value = O.SAMPLES[0].t;
  mark(0);
  render(obj.value);
}());
</script>
</body>
</html>
