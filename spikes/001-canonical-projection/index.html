<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIKE 001 · CANONICAL PROJECTION</title>
<style>
:root{--bg:#080a0c;--panel:#0b0f12;--ink:#eef2ef;--mut:#839096;--line:#2b363b;
      --hot:#ed7245;--cool:#73bce8;--green:#9ed88c;--gold:#d7ae67}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:10px 14px 40px}
h1{font-size:9px;letter-spacing:.24em;color:var(--gold);margin:0 0 8px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);
  background:var(--panel);padding:6px 8px;margin-bottom:8px}
.bar button{background:transparent;border:1px solid var(--line);color:var(--mut);
  font:inherit;font-size:9px;letter-spacing:.1em;padding:4px 8px;cursor:pointer}
.bar button:hover{color:var(--ink);border-color:#3d4a51}
.bar button.on{color:var(--gold);border-color:var(--gold)}
.bar input{background:#0e1418;border:1px solid var(--line);color:var(--ink);font:inherit;
  font-size:11px;padding:4px 7px;min-width:190px}
.bar .sp{flex:1}
.hint{color:var(--mut);font-size:9px;letter-spacing:.06em}
.stage{border:1px solid var(--line);background:#060809;min-height:300px;position:relative;overflow:hidden}
.node{cursor:pointer}
.node .gl{stroke-width:1.4;fill:none}
.node text{font-size:8px;fill:var(--mut);font-family:inherit}
.node.foc .gl{stroke-width:2.6}
.node.foc text{fill:var(--ink)}
.face{fill:none;stroke:#1c2429;stroke-width:1}
.faceLabel{font-size:8px;fill:#4a575e;letter-spacing:.14em}
.faceQ{font-size:6.5px;fill:#39444a}
.insp{border:1px solid var(--line);background:var(--panel);margin-top:8px;padding:7px 9px}
.insp h2{font-size:9px;letter-spacing:.18em;color:var(--gold);margin:0 0 5px;font-weight:600}
.insp table{border-collapse:collapse;width:100%}
.insp td{vertical-align:top;padding:2px 6px 2px 0;font-size:10px}
.insp td.k{color:var(--gold);white-space:nowrap;letter-spacing:.1em;font-size:8px}
.insp td.v{color:var(--ink)}
.insp .un{color:#6a4a4a}
.trail{color:var(--mut);font-size:9px}
</style>
</head>
<body>
<h1>SPIKE 001 · ONE OBJECT, MANY PROJECTIONS</h1>

<div class="bar">
  <button data-p="LINE" class="on">LINE</button>
  <button data-p="RING">RING</button>
  <button data-p="ROOM">ROOM</button>
  <button data-p="GLYPH">GLYPH</button>
  <span class="sp"></span>
  <input id="type" placeholder="type a token + enter…" autocomplete="off">
  <button id="ret">RETURN</button>
</div>

<div class="stage" id="stage"></div>

<div class="insp">
  <h2 id="inspH">FOCUS</h2>
  <table id="inspT"></table>
  <div class="trail" id="trail"></div>
</div>

<script>
/* ============================================================================
 * THE POINT OF THIS SPIKE
 * One object must survive four radically different perceptual arrangements
 * without losing identity, address, focus, provenance or action history.
 *
 * THE IDENTITY GLYPH, and why a hash is legitimate HERE.
 * In an earlier build, a hash was used to invent the RADII of a figure that
 * claimed to MEASURE something, and it was rightly rejected as decoration.
 * This is a different job. The requirement here is only:
 *      same id -> identical mark, forever; different ids -> distinguishable.
 * That is precisely what a hash is for. The glyph is an IDENTITY, not a
 * measurement. It encodes nothing about the object except which object it is.
 * Every other property appears as an OVERLAY, never as a change of base shape.
 * ========================================================================== */

/* ---------- CanonicalNode — the only thing projections may consume ---------- */
const SEED = [
  {id:'water',     kind:'TERM',    source:'code',       label:'water'},
  {id:'bear',      kind:'TERM',    source:'code',       label:'bear'},
  {id:'mudra',     kind:'TERM',    source:'readfield',  label:'mudra'},
  {id:'fix',       kind:'TERM',    source:'code',       label:'fix'},
  {id:'compost',   kind:'TERM',    source:'material',   label:'compost'},
  {id:'threshold', kind:'PASSAGE', source:'readfield',  label:'threshold'},
  {id:'ring',      kind:'MEASURE', source:'audio',      label:'ring'},
  {id:'cassette',  kind:'ROUTE',   source:'git',        label:'cassette'},
  {id:'fovea',     kind:'MEASURE', source:'readfield',  label:'fovea'},
  {id:'return',    kind:'TASK',    source:'git',        label:'return'},
  {id:'ground',    kind:'MEASURE', source:'material',   label:'ground'},
  {id:'intent',    kind:'TASK',    source:'code',       label:'intent'}
];

const FACES = {
  F:{name:'PRESENT',   q:'What is here now?'},
  B:{name:'RETURN',    q:'What brought this here, and how does it return?'},
  L:{name:'INPUT',     q:'What enters, constrains, or precedes this object?'},
  R:{name:'OUTPUT',    q:'What may leave, transform, or become reachable?'},
  U:{name:'INTENTION', q:'What governs this instrument when presentation changes?'},
  D:{name:'GROUND',    q:'What is actually supported, checked, or still unresolved?'}
};

function mkNode(o){
  const rnd = fnv(o.id);
  return {
    id:o.id, label:o.label||o.id, kind:o.kind, source:o.source,
    address:{
      F:o.label||o.id,
      B:(o.source||'unknown')+' · seeded',
      L:null, R:null,
      U:(o.kind||'')+' in the field',
      D:null
    },
    relations:[],
    evidence:(rnd%3===0)?[{claim:'appears in seed set',source:'spike/001',status:'ASSERTED'}]:[],
    overlays:{},
    focus:{level:'PERIPHERY'}
  };
}
let NODES = SEED.map(mkNode);

/* ---------- the identity glyph: id -> stable polygon. Measurement: none. ---------- */
function fnv(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function identityGlyph(id,size){
  const h=fnv(id);
  const sides = 3 + (h % 6);                 // 3..8
  const rot   = ((h>>>5) % 360) * Math.PI/180;
  const R     = size/2 - 2;
  const r2    = fnv(id+'#2');
  const pts=[];
  for(let i=0;i<sides;i++){
    const a = rot - Math.PI/2 + i*(Math.PI*2/sides);
    const jitter = 0;                         // NO per-vertex noise: identity only
    pts.push([Math.cos(a)*R*(1+jitter), Math.sin(a)*R*(1+jitter)]);
  }
  // an inner mark that is ALSO identity-derived, so the glyph is recognisable small
  const ip = 0.30 + ((r2>>>3)%40)/100;        // 0.30..0.70
  const ipts = pts.map(([x,y])=>[x*ip,y*ip]);
  return {pts,ipts,sides,rot};
}
function glyphSVG(id,size,colour,focused){
  const g=identityGlyph(id,size), c=size/2;
  const path = a => a.map(([x,y],i)=>(i?'L':'M')+(c+x).toFixed(1)+' '+(c+y).toFixed(1)).join(' ')+' Z';
  return '<g class="gl" stroke="'+colour+'">'
       + '<path d="'+path(g.pts)+'"/>'
       + '<path d="'+path(g.ipts)+'" opacity=".5"/>'
       + (focused?'<circle cx="'+c+'" cy="'+c+'" r="1.6" fill="'+colour+'" stroke="none"/>':'')
       + '</g>';
}

/* ---------- state: projection + focus live OUTSIDE the projections ---------- */
const STATE = { projection:'LINE', focusedId:null, trail:[], typed:[] };

/* ---------- the four projections ---------- */
function nodes(){ return NODES }

function projLINE(w,h){
  const list=nodes(), S=34, gap=54;
  let out='<svg width="'+w+'" height="'+h+'">';
  list.forEach((n,i)=>{
    const x=40+i*gap, y=h/2;
    const foc = STATE.focusedId===n.id;
    const col = foc?'var(--gold)':(n.evidence.length?'var(--green)':'var(--mut)');
    out+='<g class="node'+(foc?' foc':'')+'" data-id="'+n.id+'" transform="translate('+(x-S/2)+','+(y-S/2)+')">'
       + glyphSVG(n.id,S,col,foc)+'</g>';
    out+='<text x="'+x+'" y="'+(y+S/2+12)+'" text-anchor="middle" font-size="7" fill="'+(foc?'#eef2ef':'#6b767c')+'">'+esc(n.label)+'</text>';
  });
  out+='</svg>';
  return out;
}

function projRING(w,h){
  const list=nodes(), cx=w/2, cy=h/2, R=Math.min(w,h)/2-46, S=32;
  let out='<svg width="'+w+'" height="'+h+'">';
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#1c2429"/>';
  list.forEach((n,i)=>{
    const a=-Math.PI/2+i*(Math.PI*2/list.length);
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
    const foc=STATE.focusedId===n.id;
    const col=foc?'var(--gold)':(n.evidence.length?'var(--green)':'var(--mut)');
    out+='<g class="node'+(foc?' foc':'')+'" data-id="'+n.id+'" transform="translate('+(x-S/2)+','+(y-S/2)+')">'
       + glyphSVG(n.id,S,col,foc)+'</g>';
  });
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#2b363b"/>';
  out+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="7" fill="#4a575e">FOVEA</text>';
  out+='</svg>';
  return out;
}

/* ROOM: six faces of the shell. Position itself is the address. */
function projROOM(w,h){
  const cols={'L':0,'F':1,'R':2}, rows={'U':0,'F':1,'D':2};
  const cw=(w-40)/3, ch=(h-50)/3;
  let out='<svg width="'+w+'" height="'+h+'">';
  const place=(f,col,row)=>{
    const x=20+col*cw, y=20+row*ch;
    const inFace=nodes().filter(n=>(n.addressF||n.address[f])===f);
    out+='<rect class="face" x="'+x+'" y="'+y+'" width="'+(cw-8)+'" height="'+(ch-8)+'"/>';
    out+='<text class="faceLabel" x="'+(x+6)+'" y="'+(y+13)+'">'+f+' · '+FACES[f].name+'</text>';
    out+='<text class="faceQ" x="'+(x+6)+'" y="'+(y+22)+'">'+esc(FACES[f].q.slice(0,42))+'</text>';
    inFace.forEach((n,i)=>{
      const gx=x+14+i*30, gy=y+34;
      const foc=STATE.focusedId===n.id;
      const col2=foc?'var(--gold)':'var(--mut)';
      out+='<g class="node'+(foc?' foc':'')+'" data-id="'+n.id+'" transform="translate('+(gx-13)+','+(gy-13)+')">'+glyphSVG(n.id,26,col2,foc)+'</g>';
    });
    return (inFace.length?1:0);
  };
  place('U',1,0); place('L',0,1); place('F',1,1); place('R',2,1); place('B',1,1); place('D',1,2);
  // the folded layer (B) overlaps F deliberately — that is the fold
  out+='</svg>';
  return out;
}

function projGLYPH(w,h){
  const list=nodes(), S=30, per=Math.max(1,Math.floor((w-40)/(S+14)));
  let out='<svg width="'+w+'" height="'+h+'">';
  list.forEach((n,i)=>{
    const x=24+(i%per)*(S+14), y=28+Math.floor(i/per)*(S+20);
    const foc=STATE.focusedId===n.id;
    const col=foc?'var(--gold)':(n.evidence.length?'var(--green)':'var(--mut)');
    out+='<g class="node'+(foc?' foc':'')+'" data-id="'+n.id+'" transform="translate('+x+','+y+')">'+glyphSVG(n.id,S,col,foc)+'</g>';
  });
  out+='</svg>';
  return out;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ---------- the projection switch. This is the whole instrument. ---------- */
function render(){
  const st=document.getElementById('stage');
  const w=st.clientWidth||900, h=Math.max(300,st.clientHeight||300);
  st.innerHTML = ({LINE:projLINE,RING:projRING,ROOM:projROOM,GLYPH:projGLYPH}[STATE.projection])(w,h);
  st.querySelectorAll('.node').forEach(g=>{
    g.addEventListener('click',()=>focus(g.dataset.id));
  });
  document.querySelectorAll('.bar [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===STATE.projection));
  renderInspector();
}

/* ---------- Focus: moves resolution budget. Lives outside every projection. ---------- */
function focus(id){
  STATE.trail.push({projection:STATE.projection,focusedId:STATE.focusedId});
  if(STATE.trail.length>40)STATE.trail.shift();
  STATE.focusedId=id;
  NODES.forEach(n=>n.focus={level:n.id===id?'FOVEA':'PERIPHERY'});
  render();
}

function setProjection(p){
  STATE.trail.push({projection:STATE.projection,focusedId:STATE.focusedId});
  STATE.projection=p;
  render();     // focus is NOT touched — that is the invariant under test
}

/* ---------- Return: restore the exact prior (projection, focus) tuple ---------- */
function doReturn(){
  const prev=STATE.trail.pop();
  if(!prev){flash('nothing to return to');return}
  STATE.projection=prev.projection;
  STATE.focusedId=prev.focusedId;
  NODES.forEach(n=>n.focus={level:n.id===prev.focusedId?'FOVEA':'PERIPHERY'});
  render();
}

function renderInspector(){
  const n=NODES.find(x=>x.id===STATE.focusedId);
  const T=document.getElementById('inspT'), Hh=document.getElementById('inspH');
  if(!n){
    Hh.textContent='FOCUS — nothing focused';
    T.innerHTML='<tr><td class="v" colspan="2">Click any glyph. Focus is a property of the object, not of the projection, so it survives every switch.</td></tr>';
  }else{
    Hh.textContent='FOCUS — '+n.label+'  ·  '+n.id;
    T.innerHTML=Object.keys(FACES).map(f=>{
      const v=n.address[f];
      return '<tr><td class="k">'+f+' '+FACES[f].name+'</td><td class="v'+((v==null)?' un':'')+'">'
        + (v==null? 'UNRESOLVED' : esc(v)) + '</td></tr>';
    }).join('')
    + '<tr><td class="k">IDENTITY</td><td class="v">'+n.kind+' · '+n.source+' · glyph from id alone</td></tr>';
  }
  document.getElementById('trail').textContent =
    'projection: '+STATE.projection+'   ·   focus: '+(STATE.focusedId||'none')
    +'   ·   trail: '+STATE.trail.length+'   ·   nodes: '+NODES.length;
}

/* ---------- immediate manifestation: a typed token exists the moment it is ---------- */
function addToken(text){
  const id=String(text||'').trim().toLowerCase();
  if(!id)return;
  if(NODES.some(n=>n.id===id)){flash('already present');return}
  STATE.trail.push({projection:STATE.projection,focusedId:STATE.focusedId});
  const n=mkNode({id:id,label:id,kind:'TERM',source:'typed'});
  n.address.U='typed just now — unresolved until interpreted';
  n.address.B='typed · no provenance yet';
  n.evidence=[];
  NODES.push(n);
  STATE.focusedId=id;
  NODES.forEach(x=>x.focus={level:x.id===id?'FOVEA':'PERIPHERY'});
  render();
}

function flash(msg){
  const t=document.getElementById('trail'); t.textContent=msg;
}

/* ---------- wire ---------- */
document.querySelectorAll('.bar [data-p]').forEach(b=>b.addEventListener('click',()=>setProjection(b.dataset.p)));
document.getElementById('ret').addEventListener('click',doReturn);
document.getElementById('type').addEventListener('keydown',e=>{
  if(e.key==='Enter'){addToken(e.target.value);e.target.value=''}
});
window.addEventListener('resize',()=>render());

/* expose for headless verification */
window.SPIKE=Object.freeze({
  state:()=>JSON.parse(JSON.stringify(STATE)),
  nodes:()=>NODES.map(n=>({id:n.id,kind:n.kind,source:n.source,focus:n.focus.level})),
  setProjection,focus,doReturn,addToken,
  glyph:(id,size)=>JSON.stringify(identityGlyph(id,size||30)),
  invariance:()=>{
    const a=NODES.map(n=>n.id+':'+n.kind+':'+n.source).join('|');
    setProjection('RING'); setProjection('ROOM'); setProjection('GLYPH'); setProjection('LINE');
    const b=NODES.map(n=>n.id+':'+n.kind+':'+n.source).join('|');
    return {before:a,after:b,identical:a===b};
  }
});

render();
</script>
</body>
</html>
