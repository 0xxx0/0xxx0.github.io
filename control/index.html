<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CURRENT / CONTROL</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8ecef;background:#0b0d0e}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 20px 64px}
a{color:#a8d7ff}header{display:grid;grid-template-columns:1fr auto;gap:18px;border-bottom:1px solid #3a4145;padding-bottom:18px;margin-bottom:22px}
h1{font-size:clamp(30px,7vw,68px);line-height:.92;margin:0}.tag{font-size:11px;letter-spacing:.13em;color:#98a3a8}
nav{display:flex;gap:12px;flex-wrap:wrap;align-items:start}nav a{border:1px solid #465057;padding:7px 9px;text-decoration:none}
.laws{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 24px}.laws span{border:1px solid #30373b;padding:5px 7px;font-size:11px;color:#aeb8bd}
section{margin:28px 0}.head{display:flex;justify-content:space-between;border-bottom:1px solid #3a4145;padding-bottom:6px;margin-bottom:8px;font-size:12px;letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #30373b;padding:14px;min-height:150px}.card b{font-size:14px}.state{font-size:10px;color:#96d3aa;margin:5px 0 14px}.card p{font:12px/1.45 system-ui,sans-serif;color:#b7c0c4;margin:0}.route{display:block;margin-top:12px;font-size:11px}
.list{display:grid;gap:5px}.row{display:grid;grid-template-columns:180px 1fr;gap:12px;border-bottom:1px solid #24292c;padding:8px 0;font-size:12px}.row span:last-child{color:#b7c0c4}
.next{border:1px solid #d5a45c;padding:18px}.next b{color:#e8bf7b}.next p{margin:8px 0 0;font:14px/1.5 system-ui,sans-serif}
footer{margin-top:36px;color:#788388;font-size:11px}
@media(max-width:720px){header{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body><main>
<header><div><div class="tag">COLD-START / RECOVERY / EXECUTION</div><h1>CURRENT</h1></div><nav><a href="../dock/">DOCK</a><a href="../">FIELD</a><a href="./migration/">MIGRATION</a><a href="./REPRESENTATION.json">KERNEL</a><a href="./QUEUE.json">QUEUE</a><a href="./HERMES_QUEUE.json">HERMES QUEUE</a><a href="./QA.json">QA</a><a href="./HERMES.md">HERMES</a></nav></header>
<div id="app">Loading current state…</div>
<footer>Large archive · small active surface · repository/live evidence outranks recollection.</footer>
<script>
fetch('./CURRENT.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const links=x=>(x.evidence||[]).map(e=>'<a class="route" href="..'+esc(e)+'">'+esc(e)+'</a>').join('');
document.getElementById('app').innerHTML=
'<div class="laws">'+d.laws.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'+
'<section><div class="head"><b>ACTIVE FRONTS</b><span>'+d.active_fronts.length+'</span></div><div class="grid">'+
d.active_fronts.map(x=>'<div class="card"><b>'+esc(x.id.toUpperCase())+'</b><div class="state">'+esc(x.state)+'</div><p>'+esc(x.objective)+'</p>'+links(x)+'</div>').join('')+
'</div></section>'+
'<section><div class="head"><b>CURRENT HEADS</b><span>'+d.current_heads.length+'</span></div><div class="list">'+
d.current_heads.map(x=>'<div class="row"><b>'+esc(x.head)+'</b><span>'+esc(x.retained_function)+' · '+esc(x.state)+'</span></div>').join('')+
'</div></section>'+
'<section><div class="head"><b>RECOVERY TARGETS</b><span>PAY RENT</span></div><div class="list">'+
d.recovery_targets.map(x=>'<div class="row"><b>'+esc(x.id)+'</b><span>'+esc(x.payoff)+'</span></div>').join('')+
'</div></section>'+
'<section class="next"><b>NEXT / '+esc(d.next_single_action.id)+'</b><p>'+esc(d.next_single_action.instruction)+'</p></section>';
}).catch(e=>document.getElementById('app').textContent='CURRENT.json unavailable: '+e.message);
</script>
</main></body></html>
