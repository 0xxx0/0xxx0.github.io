<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAW Engine Playground v1</title><style>
:root{--bg:#efede5;--ink:#151515;--muted:#6e6962;--line:#b9b3a8;--paper:#f7f4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{position:sticky;top:0;z-index:5;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(239,237,229,.96)}h1{font:600 13px/1.2 ui-monospace,monospace;letter-spacing:.18em;margin:0 0 9px}.controls{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid var(--ink);background:transparent;padding:6px 8px;font:11px ui-monospace,monospace;cursor:pointer}button.on{background:var(--ink);color:var(--bg)}main{max-width:1000px;margin:auto;padding:25px 16px 80px}.hero{font-size:25px;line-height:1.35;max-width:750px;margin:10px 0 30px}.cycle{display:flex;gap:4px;flex-wrap:wrap;margin:15px 0 30px}.step{padding:8px 10px;border:1px solid var(--line);font:11px ui-monospace,monospace}.step.active{background:var(--ink);color:var(--bg)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:var(--paper);border-top:2px solid var(--ink);padding:16px;min-height:260px}.label{font:11px ui-monospace,monospace;color:var(--muted);letter-spacing:.12em}.big{font-size:23px;line-height:1.42;margin:12px 0}.small{font:12px/1.55 ui-monospace,monospace;color:var(--muted)}.models{display:grid;gap:8px;margin-top:12px}.model{border:1px solid var(--line);padding:9px;font:12px/1.4 ui-monospace,monospace}.trace{padding:9px;border-left:3px solid var(--line);margin:8px 0}.route{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.relation{font:11px ui-monospace,monospace;padding:5px 7px;border:1px dashed var(--line)}.sleep{filter:blur(5px);opacity:.55}.foot{font:11px ui-monospace,monospace;color:var(--muted);border-top:1px solid var(--line);margin-top:35px;padding-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{font-size:21px}}
</style></head><body><header><h1>YOU’RE A WAKE / ENGINE PLAYGROUND v1</h1><div class=controls><button data-node="grain" class=on>GRAIN</button><button data-node="reset">RESET</button><button data-node="meal">MEAL</button><button data-node="wind">WIND</button><button id=next>NEXT OPERATOR</button><button id=sleep>SLEEP MODEL</button><button id=prov>PROVENANCE</button></div></header><main><div class=hero id=hero></div><div class=cycle id=cycle></div><div class=grid><section class=panel><div class=label>SURFACE / CONTACT</div><div class=big id=surface></div><div class=label>TRACES</div><div id=traces></div></section><section class=panel><div class=label>LIVE MODELS / HOLD</div><div class=models id=models></div><div class=label style="margin-top:15px">OPEN MOVES</div><div class=route id=moves></div></section></div><div class=foot id=foot>Yoneda-like relation signature = editorial analogy. No view is the master record.</div></main><script>
const cycle=['SLEEP','WAKE','SAMPLE','WITHHOLD','TURN','ACT','TRACE','SLEEP','AGAIN']; let ci=1, node='grain', showProv=false, sleeping=false;
const data={grain:{hero:'A wake is a delta that survives release.',surface:'Coarse grit and bodily residue arrive before explanation.',traces:[['YOU','skin / pressure / smell'],['THEY','a trace can outlast the mover']],models:['ordinary residue','memory-contaminated perception','deliberate arrangement'],moves:['sample another channel','withhold naming','carry one trace'],prov:'SOURCE/ATTESTED: opening sensory architecture. PROPOSED: wake-as-delta formalization.'},reset:{hero:'Relation can persist while remembered sequence does not.',surface:'A familiar person resumes the greeting after attention shifts.',traces:[['YOU','familiarity / concern'],['THEY','repeated conversational reset'],['TRACE','uneven continuity']],models:['memory disruption','attention/state effect','injury-related cause','unknown'],moves:['assign a specific helper','observe what persists','seek care','release mechanism'],prov:'ATTESTED: reset behavior + injury clues. INFERRED: causal relation. PROPOSED: care-before-certainty operator.'},meal:{hero:'Horror can reclassify evidence without becoming proof.',surface:'An unnamed meal, an absence, a phrase and a trace become newly related.',traces:[['YOU','disgust / recognition'],['THEY','bowl / phrase / missing person / artifact'],['ARCHIVE','cannibalism + recursion cluster']],models:['meal implicated in disappearance','deliberate misdirection','coincidental trace','ontology unresolved'],moves:['stop','sample another witness','preserve provenance','refuse premature merge'],prov:'ATTESTED: meal/cannibalism/recursion adjacency. INFERRED/PROPOSED: exact relation to missing companion.'},wind:{hero:'The world may fail to rhyme. Good.',surface:'Air and sound cross the chamber through an ordinary opening.',traces:[['YOU','Sa / Moom / pressure'],['THEY','cloth / vent / airflow'],['MOUTH','frication / resonance']],models:['ordinary airflow','signal','both','not enough evidence'],moves:['listen','locate source','act on air, not lore','sleep the pattern'],prov:'ATTESTED: Sa/Moom/wind material. PROPOSED: false-pattern/ordinary-cause calibration.'}};
function render(){let d=data[node];document.getElementById('hero').textContent=d.hero;document.getElementById('surface').textContent=d.surface;document.getElementById('traces').innerHTML=d.traces.map(t=>`<div class="trace ${sleeping?'sleep':''}"><span class=label>${t[0]}</span><br>${t[1]}</div>`).join('');document.getElementById('models').innerHTML=d.models.map(m=>`<div class="model ${sleeping?'sleep':''}">${m}</div>`).join('');document.getElementById('moves').innerHTML=d.moves.map(m=>`<span class=relation>${m}</span>`).join('');document.getElementById('cycle').innerHTML=cycle.map((c,i)=>`<span class="step ${i===ci?'active':''}">${c}</span>`).join('');document.getElementById('foot').textContent=showProv?d.prov:'Yoneda-like relation signature = editorial analogy. No view is the master record.';document.querySelectorAll('[data-node]').forEach(b=>b.classList.toggle('on',b.dataset.node===node));document.getElementById('sleep').classList.toggle('on',sleeping);document.getElementById('prov').classList.toggle('on',showProv)}
document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{node=b.dataset.node;sleeping=false;ci=1;render()});document.getElementById('next').onclick=()=>{ci=(ci+1)%cycle.length;if(cycle[ci]==='SLEEP')sleeping=true;if(cycle[ci]==='WAKE'||cycle[ci]==='AGAIN')sleeping=false;render()};document.getElementById('sleep').onclick=()=>{sleeping=!sleeping;ci=sleeping?7:1;render()};document.getElementById('prov').onclick=()=>{showProv=!showProv;render()};render();
</script></body></html>
