NS = ({ html: "http://www.w3.org/1999/xhtml" , svg: "http://www.w3.org/2000/svg" })

const range = (n,x) => Array(n).fill(null).map((_, i) => x?(x[i]||x):i)
, zip = (arr, ...arrs) => { return arr.map((val, i) => arrs.reduce((a, arr) => [...a, arr[i]], [val])); }
, TYPE_OF = (x)=> Object.prototype.toString.call(x).slice(8,-1)
, jsonml2dom = (markup,nmspc=NS.html)=> {
    const el = document.createElementNS(nmspc,markup[0])
        markup.slice(1).forEach((node) =>
            TYPE_OF(node)==='Object' ? Object.entries(node).map(e => el.setAttribute(e[0],e[1]))
          : TYPE_OF(node) === 'Array' ? el.appendChild(jsonml2dom(node, nmspc))
          : TYPE_OF(node) === 'String' ? el.appendChild(document.createTextNode(node))
          : new Error(`Invalid type ${TYPE_OF(node)} for ${node}`) );return el }

, render = (target)=>(dat)=> target.appendChild(dat)
, renderScript = (script)=> render(document.head)(script) //console.log('Added script to head')// TODO: cleanup message
, AP_C = (op)=>(fn)=>(xs)=> Array.prototype[op].call(xs, fn)
//    , umap = (fn)=>(dat)=>(xs)=> AP_C('map')(xs)()
, umap = (fn)=>(dat)=>(xs)=> Array.prototype.map.call(xs, (x,i,o)=>fn(x,i,o)(dat))
, objectify = (a)=> a.reduce((o,[k,v])=>(o[k]=v,o),{})
, mapStats  = (dict)=>(n)=>(xs)=> umap( (x,i)=>(dat)=>attr(x)(objectify(dat[n])) )(dict)(xs)
, attr=(node)=>(a)=>
     typeof a === 'string'? node.getAttribute(a)
	:typeof a === 'object'? Object.entries(a).map(entry=>(node.setAttribute(entry[0],entry[1]) ) )
//    ,console.log(`Set ${node||node.valueOf()}'s attribute '${entry[0]}':'${entry[1]}'`)
    :new Error(`prob w ${node}:${node.id}:'${entry[0]}' to '${entry[1]}'`)

spiralConf= //numPts, PtScale, origin, angle, dT, spc, revs
      [ 150 , 0.33 , [240,240] , 4 , 0.4 , 80 , 2 ]
const loadBaseSpiral = ([numPts, PtScale, origin, angle, dT, spc, revs])=>(target)=> {
	//--clear previous spiral/discs----
	for(var k=target.childNodes.length-1;k>=0;k--) target.removeChild(target.childNodes.item(k))
//Array.prototype.map.call(svg.childNodes,(a,i,o)=>svg.removeChild(a))
//    Array.prototype.map.call(Array.prototype.slice.call(svg.childNodes) ,(c)=>c.parentNode.removeChild(c))
//[points, scale, [X,Y], angle, torsion, revolutions, space]
//[150,0.33,[240,240],4,0.4,2,80]
    let S=spc/(2*Math.PI)
	  , DegSep=(2*Math.PI*revs/numPts)
      , Ax=(a)=>(S*a)*Math.cos(a)+origin[0]
      , Ay=(a)=>-(S*a)*Math.sin(a)+origin[1]
range(numPts).map(i=>{
    a=i*DegSep+angle,
    node=Disc.cloneNode(true)
, attr(node)( { "transform":`translate(${Ax(a)},${Ay(a)}) scale(${PtScale}) rotate(${dT*(i)})`
            , "id":`disc${(i+1)}`
            , "status":"0"                     // DATA~> STATUS
            , "onmouseover":"showDiscId(evt)"  // LISTENER
                } )
    node.childNodes.item(12).firstChild.data=(i+1)
    render(target)(node)
    })        }

var PrevDisc=null
var changeRowCnt=2

randomDataChange = ()=>{
	changeRowCnt=1
	//--CLEAR TABLE---
	var rows=changeTable.rows
	var n=rows.length
	for(var k=n-1;k>0;k--) changeTable.deleteRow(k)


	loadBaseSpiral(spiralConf)(discG) //---totally rewrites spiral and discs---
	//----how many elements to change?: 30 thru 100
	var changedElems=rnd(1,24)
	//---which elements to change?---
	var elemIdArray=[]
	var elemDupString="," //---only a single status for each elem---
	for(var k=0;k<changedElems;k++) {
		var idNum=rnd(1,99)
		if(elemDupString.indexOf(","+idNum+",")==-1) { elemIdArray[k]=idNum; elemDupString+=idNum+"," }
		else k-- }
	//---what status type for the elem?----
	for(var k=0;k<elemIdArray.length;k++) elemIdArray[k]+=","+rnd(1,12)
	var time=new Date()

	for(var k=0;k<elemIdArray.length;k++)
	{
		var split=elemIdArray[k].split(",")
		var idNum=split[0]
		var statusNum=split[1]
		var changeDisc=document.getElementById("disc"+idNum)

		Ellipse    =changeDisc.childNodes.item(1)
		SpineUL    =changeDisc.childNodes.item(2)
		SpineUR    =changeDisc.childNodes.item(3)
		SpineLL    =changeDisc.childNodes.item(4)
		SpineLR    =changeDisc.childNodes.item(5)
		Rect       =changeDisc.childNodes.item(6)
		Circle     =changeDisc.childNodes.item(7)
		SatLeft    =changeDisc.childNodes.item(8)
		SatRight   =changeDisc.childNodes.item(9)
		SatTop     =changeDisc.childNodes.item(10)
		SatBot     =changeDisc.childNodes.item(11)

		changeDisc.setAttribute("status",statusNum)
		showStatus(statusNum)

		var row = changeTable.insertRow(changeRowCnt++);
		var cntCell = row.insertCell(0);
		var idCell = row.insertCell(1);
		var statusCell = row.insertCell(2);
		statusCell.align="center"
		var timeCell = row.insertCell(3);

		// Add some text to the new cells:
		cntCell.innerHTML = changeRowCnt-1
		idCell.innerHTML = "<a title='zoom to me' href=javascript:zoomMe("+idNum+") >disc"+idNum+"</a>"
		statusCell.innerHTML = statusNum
		timeCell.innerHTML = time
	}

	if(PrevDisc) discG.removeChild(PrevDisc)
	PrevDisc=null
	hideDiscId()

	if(sortOnStatusCheck.checked==true) sortOnStatus()
}

var PrevIdDisc=null
showDiscId = (evt)=> {
	var x=evt.clientX
	var y=evt.clientY
	var target=evt.target.parentNode
	var disc=target
	var targetId=disc.getAttribute("id")
	var reDisc=/disc/
	var discNum=parseInt(targetId.replace(reDisc,""));
	var status=disc.getAttribute("status")

	var myMouseX=evt.clientX;
	var myMouseY=evt.clientY;
	var statusX = myMouseX + document.documentElement.scrollLeft;
	var statusY = myMouseY + document.documentElement.scrollTop;
	StatusRect.style.visibility="visible"

	StatusRect.style.left=(statusX+15)+"px"
	StatusRect.style.top=(statusY+5)+"px"

	if(status=="0") StatusRect.style.backgroundColor="lemonchiffon"
	else StatusRect.style.backgroundColor="darkorange"

	StatusRect.innerHTML=(discNum)+' hi!'

	if(PrevIdDisc)
	{   var transform=PrevIdDisc.getAttribute("transform")
		var transSplit=transform.split(" scale(1.6)")
		transform=transSplit[0]
		PrevIdDisc.setAttribute("transform",transform) }

	var transform=disc.getAttribute("transform")
	transform+=" scale(1.6)"
	disc.setAttribute("transform",transform)
//  disc.setAttribute('')
attr(disc)({x:0, y:0})

	PrevIdDisc=disc
}

hideDiscId = ()=> {
	StatusRect.style.visibility="hidden"
	if(PrevIdDisc) {
		var transform=PrevIdDisc.getAttribute("transform")
		var transSplit=transform.split(" scale(1.6)")
		transform=transSplit[0]
		PrevIdDisc.setAttribute("transform",transform) }
	PrevIdDisc=null }

//----checkbox----
var SortArray=[]
var SortNormalArray=[]
sortOnStatus = ()=> {
if(sortOnStatusCheck.checked==true)	{
		SortArray=[]
		SortNormalArray=[]
		for(var k=0;k<=12;k++) {
			for(var m=0;m<discG.childNodes.length;m++) {
				var elem=discG.childNodes.item(m)
				if(elem.getAttribute("status")) {
					var status=elem.getAttribute("status")
				    if(status==k)
					{	if(status==0) SortNormalArray[SortNormalArray.length]=elem.cloneNode(true)
						else SortArray[SortArray.length]=elem.cloneNode(true) } } } }
	   	buildSortSpiral() }  else { unbuildSortSpiral() } }

buildSortSpiral = ()=>
{
	//--clear previous spiral/discs----
	for(var k=discG.childNodes.length-1;k>=0;k--)
		discG.removeChild(discG.childNodes.item(k))

	var concatSortArray=SortNormalArray.concat(SortArray)
	var discNum=concatSortArray.length

	var discScale=.33
	var centerX=240
	var centerY=240
	//---radians---
	var startAngle=4
	var discTwist=.4
	var separation=80
	var revs=1.98

	var S=separation/(2*Math.PI)

	//---degrees of separation between points(in radians)---
	var DegSep=(2*Math.PI*revs/discNum)
	var disc=null
	var NextAngle=null
	var Ax=null
	var Ay=null
	var twist=0

	for(var k=0;k<discNum;k++)
	{
		NextAngle=DegSep*k+startAngle
		Ax=(S*NextAngle)*Math.cos(NextAngle)+centerX
		Ay=-(S*NextAngle)*Math.sin(NextAngle)+centerY

		disc=concatSortArray[k]
		twist+=discTwist
		disc.setAttribute("transform"," translate("+Ax+" "+Ay+") scale("+discScale+") rotate("+twist+")")
//        discG.appendChild(disc)
		discG.appendChild(jsonml2dom(["use",{href:"Disc"},'']))
	} }

unbuildSortSpiral = ()=>
{
	//--clear previous spiral/discs----
	for(var k=discG.childNodes.length-1;k>=0;k--) discG.removeChild(discG.childNodes.item(k))

	var concatSortArray=SortNormalArray.concat(SortArray)
	var discNum=concatSortArray.length
	var dotPairArray=[]
	var re=/disc/
	for(var k=0;k<concatSortArray.length;k++)
	{
		var sortDisc=concatSortArray[k]
		var sortDiscId=sortDisc.getAttribute("id")
		var idNum=sortDiscId.replace(re,"")
		dotPairArray[dotPairArray.length]=idNum+"."+k
	}
	dotPairArray.sort(numSort)
	var discScale=.25
	var centerX=165
	var centerY=165
	//---radians---
	var startAngle=4
	var discTwist=.4
	var separation=56
	var revs=1.98
	var S=separation/(2*Math.PI)
	//---degrees of separation between points(in radians)---
	var DegSep=(2*Math.PI*revs/discNum)
	var disc=null
	var NextAngle=null
	var Ax=null
	var Ay=null
	var twist=0
	var discDot=null

	for(var k=0;k<discNum;k++)
	{
		NextAngle=DegSep*k+startAngle
		Ax=(S*NextAngle)*Math.cos(NextAngle)+centerX
		Ay=-(S*NextAngle)*Math.sin(NextAngle)+centerY

		discDot=dotPairArray[k].split(".")
		disc=concatSortArray[discDot[1]]
		twist+=discTwist
		disc.setAttribute("transform"," translate("+Ax+" "+Ay+") scale("+discScale+") rotate("+twist+")")
		discG.appendChild(disc)
    } }


//---obtain a random whole number from a thru b---
rnd = (a,b)=> a+Math.floor(Math.random()*(b-a+1))
//---used in dotPairArray---
numSort = (a,b)=> a-b
