var global_words = [];

utterance.rate = 2;

    var text    = document.getElementById('textarea').value;

utterance.onboundary = function(event){
  	var e = document.getElementById('textarea');
  	var word = getWordAt(e.value,event.charIndex);
    // Show Speaking word : x
  	document.getElementById("word").innerHTML = word;
    //Increase index of span to highlight
    console.info(global_words[wordIndex]);
    
    try{
    	document.getElementById("word_span_"+wordIndex).style.color = "blue";
    }catch(e){}
    
    wordIndex++;
};

utterance.onend = function(){
		document.getElementById("word").innerHTML = "";
    wordIndex = 0;
    document.getElementById("panel").innerHTML = "";
};

// Get the word of a string given the string and the index
function getWordAt(str, pos) {
    // Perform type conversions.
    str = String(str);
    pos = Number(pos) >>> 0;

    // Search for the word's beginning and end.
    var left = str.slice(0, pos + 1).search(/\S+$/),
        right = str.slice(pos).search(/\s/);

    // The last word in the string is a special case.
    // if (right < 0) { return str.slice(left); }
    // Return the word, using the located bounds to extract it from the string.
    // return str.slice(left, right + pos);
    right<0 ? str.slice(left) : str.slice(left,right+pos)
}

function drawTextInPanel(words_array){
console.log("--");

  	for(var i = 0;i < words_array.length;i++){
    	var html = '<span id="word_span_'+i+'">'+words_array[i]+'</span>&nbsp;';
    	panel.innerHTML += html;
    }
}

/* global MediaRecorder SpeechSynthesisUtterance MediaStream MediaSource AudioContext navigator Blob ReadableStream URL Audio FileReader * /
class SpeechSynthesisRecorder {
  constructor ({text = '', utteranceOptions = {}, recorderOptions = {}, dataType = ''}) {
    if (text === '') throw new Error('no words to synthesize')
    this.dataType = dataType
    this.text = text
    this.mimeType = MediaRecorder.isTypeSupported('audio/webm; codecs=opus')
                    ? 'audio/webm; codecs=opus' : 'audio/ogg; codecs=opus'
    this.utterance = new SpeechSynthesisUtterance(this.text)
    this.speechSynthesis = window.speechSynthesis
    this.mediaStream_ = new MediaStream()
    this.mediaSource_ = new MediaSource()
    this.mediaRecorder = new MediaRecorder(this.mediaStream_, {
      mimeType: this.mimeType,
      bitsPerSecond: 256 * 8 * 1024
    })
    this.audioContext = new AudioContext()
    this.audioNode = new Audio()
    this.chunks = []
    if (utteranceOptions) {
      if (utteranceOptions.voice) {
        this.speechSynthesis.onvoiceschanged = e => {
          const voice = this.speechSynthesis.getVoices().find(({
            name: _name
          }) => _name === utteranceOptions.voice)
          this.utterance.voice = voice
          console.log(voice, this.utterance) }
        this.speechSynthesis.getVoices()
      }
      let {
        lang, rate, pitch
      } = utteranceOptions
      Object.assign(this.utterance, {
        lang, rate, pitch
      })
    }
    this.audioNode.controls = 'controls'
    document.body.appendChild(this.audioNode)
  }
  start (text = '') {
    if (text) this.text = text
    if (this.text === '') throw new Error('no words to synthesize')
    return navigator.mediaDevices.getUserMedia({
      audio: true
    })
    // set `getUserMedia()` constraints to "auidooutput", where avaialable
    // see https://bugzilla.mozilla.org/show_bug.cgi?id=934425, https://stackoverflow.com/q/33761770
    .then(stream => navigator.mediaDevices.enumerateDevices()
      .then(devices => {
        const audiooutput = devices.find(device => device.kind == "audiooutput");
        stream.getTracks().forEach(track => track.stop())
        if (audiooutput) {
          const constraints = {
                  deviceId: {
                    exact: audiooutput.deviceId
                  }
                };
          return navigator.mediaDevices.getUserMedia({
            audio: constraints     
          });
        }
        return navigator.mediaDevices.getUserMedia({
          audio: true
        });
      }))
      .then(stream => new Promise(resolve => {
        const track = stream.getAudioTracks()[0]
        this.mediaStream_.addTrack(track)
        // return the current `MediaStream`
        if (this.dataType && this.dataType === 'mediaStream') {
          resolve({tts: this, data: this.mediaStream_})
        };
        this.mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            this.chunks.push(event.data)
          };
        }
        this.mediaRecorder.onstop = () => {
          track.stop()
          this.mediaStream_.getAudioTracks()[0].stop()
          this.mediaStream_.removeTrack(track)
          console.log(`Completed recording ${this.utterance.text}`, this.chunks)
          resolve(this)
        }
        this.mediaRecorder.start()
        this.utterance.onstart = () => {
          console.log(`Starting recording SpeechSynthesisUtterance ${this.utterance.text}`)
        }
        this.utterance.onend = () => {
          this.mediaRecorder.stop()
          console.log(`Ending recording SpeechSynthesisUtterance ${this.utterance.text}`)
        }
        this.speechSynthesis.speak(this.utterance)
      }))
  }
  blob () {
    if (!this.chunks.length) throw new Error('no data to return')
    return Promise.resolve({
      tts: this,
      data: this.chunks.length === 1 ? this.chunks[0] : new Blob(this.chunks, {
        type: this.mimeType
      })
    })
  }
  arrayBuffer (blob) {
    if (!this.chunks.length) throw new Error('no data to return')
    return new Promise(resolve => {
      const reader = new FileReader()
      reader.onload = e => resolve(({
        tts: this,
        data: reader.result }))
      reader.readAsArrayBuffer(blob ? new Blob(blob, {
        type: blob.type }) : this.chunks.length === 1 ? this.chunks[0] : new Blob(this.chunks, {
        type: this.mimeType })) }) }
  audioBuffer () {
    if (!this.chunks.length) throw new Error('no data to return')
    return this.arrayBuffer()
      .then(ab => this.audioContext.decodeAudioData(ab))
      .then(buffer => ({tts: this, data: buffer })) }
  mediaSource () {
    if (!this.chunks.length) throw new Error('no data to return')
    return this.arrayBuffer()
      .then(({
        data: ab
      }) => new Promise((resolve, reject) => {
        this.mediaSource_.onsourceended = () => resolve({
          tts: this,
          data: this.mediaSource_
        })
        this.mediaSource_.onsourceopen = () => {
          if (MediaSource.isTypeSupported(this.mimeType)) {
            const sourceBuffer = this.mediaSource_.addSourceBuffer(this.mimeType)
            sourceBuffer.mode = 'sequence'
            sourceBuffer.onupdateend = () =>
              this.mediaSource_.endOfStream()
            sourceBuffer.appendBuffer(ab)
          } else {
            reject(new Error(`${this.mimeType} is not supported`))
          }
        }
        this.audioNode.src = URL.createObjectURL(this.mediaSource_)
      }))
  }
  readableStream ({size = 1024, controllerOptions = {}, rsOptions = {}}) {
    if (!this.chunks.length) throw new Error('no data to return')
    const src = this.chunks.slice(0)
    const chunk = size
    return Promise.resolve({
      tts: this,
      data: new ReadableStream(controllerOptions || {
        start (controller) {
          console.log(src.length)
          controller.enqueue(src.splice(0, chunk))
        },
        pull (controller) {
          if (src.length === 0) controller.close()
          controller.enqueue(src.splice(0, chunk))
        }
      }, rsOptions)
    })
  }
}

window.onload = function() {
  window.AudioContext = window.AudioContext || window.webkitAudioContext;

  var audioContext = new AudioContext();
  var futureTickTime = audioContext.currentTime;
  var current16thNote = 1;
  var tempo = 120.0; //initial tempo
  var delayVal = 0; //initial delay value
  var timerID = 0;
  var mixGain = audioContext.createGain();
  var filterGain = audioContext.createGain();
  mixGain.connect(audioContext.destination);
  mixGain.gain.value = 0;
  var slider = document.getElementById("myRange");
  var delaySlider = document.getElementById("delaySlider");
  var startBtn = document.getElementById("startBtn");
  var stopBtn = document.getElementById("stopBtn");
  var tempoVal = document.getElementById("tempoVal");
  var delayRange = document.getElementById("delayRange");
  var kickDivs = document.querySelectorAll(".kicks");
  var snareDivs = document.querySelectorAll(".snare");
  var hihatDivs = document.querySelectorAll(".hihat");
  var grainDivs = document.querySelectorAll(".grains");

  var kicks = Array.prototype.slice.call(kickDivs);
  var snares = Array.prototype.slice.call(snareDivs);
  var hihats = Array.prototype.slice.call(hihatDivs);
  var grains = Array.prototype.slice.call(grainDivs);
  var combinedDivs = kicks.concat(snares);

  var initDivs = (function() {

    return {
      set: function(divType, colour) {

        for (var i = 0; i < divType.length; i++) {

          divType[i].style.backgroundColor = "black";

          divType[i].addEventListener('click', function() {

            var nowColour = this.style.backgroundColor;
            var black = this.style.backgroundColor = "black";
            var otherColours = this.style.backgroundColor = colour;

            switch (nowColour) {
              case black:
                this.style.backgroundColor = colour;
                break;
              case otherColours:
                this.style.backgroundColor = "black";
                break;
            };

          }, false);

        };

      }

    };

  }());

  initDivs.set(kickDivs, "pink");
  initDivs.set(snareDivs, "lightskyblue");
  initDivs.set(hihatDivs, "lightgreen");
  initDivs.set(grainDivs, "lightslategray");

  slider.oninput = function() {

    this.step = "1";
    this.type = "range";
    this.max = "150";
    this.min = "5";
    tempo = this.value;
    tempoVal.innerHTML = tempo;
    return tempo;
  };


  function futureTick() {
    var secondsPerBeat = 60.0 / tempo;
    futureTickTime += 0.25 * secondsPerBeat; // "future note"
    current16thNote++;
    if (current16thNote > 16) {
      current16thNote = 1;
    }
  };

  function scheduleNote(beatDivisionNumber, time) {

    if (current16thNote) {
      var currentKickDiv = kickDivs[current16thNote - 1];
      var currentSnareDiv = snareDivs[current16thNote - 1];
      var currentHihatDiv = hihatDivs[current16thNote - 1];
      var currentGrainDiv = grainDivs[current16thNote - 1];

      if (currentSnareDiv.style.backgroundColor == "lightskyblue") {
        snare(time);
      };

      if (currentKickDiv.style.backgroundColor == "pink") {
        kick(time);
      };

      if (currentHihatDiv.style.backgroundColor == "lightgreen") {
        hihat(time);
      };

      if (currentGrainDiv.style.backgroundColor == "lightslategray") {
        grain(time);
      };

      nextDiv.kickCount(kicks);
      nextDiv.snareCount(snares);
      nextDiv.hihatCount(hihats);
      nextDiv.grainCount(grains);
    };

  };

  function scheduler() {

    while (futureTickTime < audioContext.currentTime + 0.1) {

      scheduleNote(current16thNote, futureTickTime);
      futureTick();

    }
    timerID = window.setTimeout(scheduler, 50.0);
  };

  //EFFECTS - Delay

  (function(){

    var feedback = audioContext.createGain();
    var delay = audioContext.createDelay();
    var leftDelay = audioContext.createDelay();
    var rightDelay = audioContext.createDelay();
    var outputmix = audioContext.createGain();

    leftDelay.delayTime.value = 0.375;
    rightDelay.delayTime.value = 0.375;

    leftDelay.connect(rightDelay);

    var merger = audioContext.createChannelMerger(2);
    leftDelay.connect(merger, 0, 0);
    rightDelay.connect(merger, 0, 1);
    merger.connect(outputmix);

    mixGain.connect(feedback);
    feedback.connect(leftDelay);
    rightDelay.connect(feedback);
    feedback.gain.value = 0.4;
    leftDelay.connect(rightDelay);

    outputmix.connect(mixGain);

    delaySlider.oninput = function() {

    this.step = "0.1";
    this.max = "0.9";
    this.min = "0";
    delayVal = this.value;
    delayRange.innerHTML = delayVal;
    outputmix.gain.value = delayVal;


    return delayVal;

  };


  }());


  //SYNTHESISED SOUNDS

  function kick(time) {

    var osc = audioContext.createOscillator();
    var osc2 = audioContext.createOscillator();
    var gainOsc = audioContext.createGain();
    var gainOsc2 = audioContext.createGain();

    osc.type = 'triangle';
    osc2.type = 'sine';

    gainOsc.gain.setValueAtTime(1, time);
    gainOsc.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
    gainOsc.connect(audioContext.destination);
    gainOsc2.gain.setValueAtTime(1, time);
    gainOsc2.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
    gainOsc2.connect(audioContext.destination);
    osc.frequency.setValueAtTime(120, time);

    for (var i = 0; i < 4096; i++) {

    node.start(time);

  function hihat(time) {

    var gainOsc4 = audioContext.createGain();
    var fundamental = 40;
    var ratios = [
      2,
      3,
      4.16,
      5.43,
      6.79,
      8.21
    ];
    var bandpass = audioContext.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 10000;
    var highpass = audioContext.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 7000;
    ratios.forEach(function(ratio) {
      var osc4 = audioContext.createOscillator();
      osc4.type = 'square';
      osc4.frequency.value = fundamental * ratio;
      osc4.connect(bandpass);
      osc4.start(time);
      osc4.stop(time + 0.05);
    });

    gainOsc4.gain.setValueAtTime(1, time);
    gainOsc4.gain.exponentialRampToValueAtTime(0.01, time + 0.05);

    bandpass.connect(highpass);
    highpass.connect(gainOsc4);
    gainOsc4.connect(mixGain);

    mixGain.gain.value = 1;
  };
