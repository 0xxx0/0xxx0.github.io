pointing = (evt) => {
//getE = (ev) => { return ev.touches ? ev.touches[0] : ev }
  var pageX = evt.pageX;
  var pageY = evt.pageY;
  if (pageX === undefined) {
    pageX = evt.clientX + document.body.scrollLeft + document.documentElement.scrollLeft;
    pageY = evt.clientY + document.body.scrollTop + document.documentElement.scrollTop;
  }
  const rect = evt.target.getBoundingClientRect()
      , offsetX = evt.clientX - rect.left
      , offsetY = evt.clientY - rect.top
  return {
     client: { x: evt.clientX, y: evt.clientY } // relative to the viewport
  ,  screen: { x: evt.screenX, y: evt.screenY } // relative to the physical screen
  ,  offset: { x: offsetX,     y: offsetY }     // relative to the event target
  ,  page:   { x: pageX,       y: pageY }        // relative to the html document
  }
}





M = (()=>{
const isNumeric = (n) => !isNaN(parseFloat(n)) && isFinite(n)
, test1 = n => isNumeric(n)

const m16Xv4 = (m, v) =>   //Multiply the point against each part of the N column, then add together
      [(v[0]*m[0])+(v[1]*m[4])+(v[2]*m[8])+(v[3]*m[12])
      ,(v[0]*m[1])+(v[1]*m[5])+(v[2]*m[9])+(v[3]*m[13])
      ,(v[0]*m[2])+(v[1]*m[6])+(v[2]*m[10])+(v[3]*m[14])
      ,(v[0]*m[3])+(v[1]*m[7])+(v[2]*m[11])+(v[3]*m[15])]
    , m16Xm16 = (m1, m2) => 
        m16Xv4(m1,[0,1,2,3].map(i=>m2[i])).concat(
        m16Xv4(m1,[4,5,6,7].map(i=>m2[i]))
      , m16Xv4(m1,[8,9,10,11].map(i=>m2[i]))
      , m16Xv4(m1,[12,13,14,15].map(i=>m2[i])) )
    , genM16 = (ms) => ms.reduce((a,c) => m16Xm16(a,c))
    , m3d = n => `matrix3d(${n.join(',')})`
    , m2d = n => `matrix(${n.join(',')})`
    , mod3dcss = ([...values]) => m3d(genM16(values))
    ; return{isNumeric, test1, err, mErrMsgs, m16Xv4, m16Xm16, genM16, m3d, m2d, mod3dcss} })()

} })()
