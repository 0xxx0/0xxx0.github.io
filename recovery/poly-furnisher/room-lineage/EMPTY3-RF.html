fuzzySearch_2 = (needle, haystack) =>{
  var hlen = haystack.length;
  var nlen = needle.length;
  (nlen > hlen) ? console.error(`sizes of (needle: [${needle}] < haystack:[${haystack}] )`)
  : (nlen === hlen) ? console.error(`sizes of (needle: [${needle}] === haystack: [${haystack}])`) : ''
  outer: for (var i = 0, j = 0; i < nlen; i++) {
    var nch = needle.toLowerCase().charCodeAt(i)
    while (j < hlen) { if (haystack.toLowerCase().charCodeAt(j++) === nch) { continue outer } }
    return '' }
  return haystack }
