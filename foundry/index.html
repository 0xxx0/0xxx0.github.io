<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOUNDRY</title>
<style>
html,body{margin:0;background:#060809;color:#eef2ef;font:13px ui-monospace,monospace;height:100%}
#boot{display:grid;place-items:center;height:100%;opacity:.7;padding:24px;text-align:center}
</style>
<div id="boot">Loading FOUNDRY…</div>
<script>
(async()=>{
  try{
    const paths=Array.from({length:8},(_,i)=>`./p/${i}.txt`);
    const parts=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error(`${p} ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in globalThis)) throw new Error('This browser needs DecompressionStream support. Try current Chrome, Edge, Firefox, or Safari.');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='FOUNDRY failed to boot: '+e.message;
    console.error(e);
  }
})();
</script>
