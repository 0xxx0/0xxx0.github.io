<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>APERTURE → READFIELD</title>
<style>html,body{margin:0;min-height:100%;background:#090b0c;color:#edf0ed;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:680px;margin:12vh auto;padding:18px;border-top:1px solid #30383c}b{color:#8dd5ff}a{color:#edf0ed}</style></head>
<body><main><b>APERTURE HAS CONVERGED INTO READFIELD.</b><p>The reusable focus kernel remains <code>/field-aperture.js</code>. The standalone public reader is now <a id="go" href="/docs/?return=/foundry/">/docs/ · READFIELD / RSVP</a>.</p><p>Redirecting…</p></main>
<script>
(()=>{'use strict';
 let handoff=false;
 try{
   const old=JSON.parse(sessionStorage.getItem('field.aperture.handoff.v01')||'null');
   if(old&&old.source!=null){
     sessionStorage.setItem('readfield.handoff.v1',JSON.stringify({schema:'readfield.handoff/v1',source:typeof old.source==='string'?old.source:JSON.stringify(old.source,null,2),label:old.label||'APERTURE HANDOFF',returnAddress:old.from||'/foundry/',created_at:new Date().toISOString(),focus:old.focus&&typeof old.focus==='object'?old.focus:null}));
     sessionStorage.removeItem('field.aperture.handoff.v01');handoff=true;
   }
 }catch(_){}
 const target='/docs/?'+(handoff?'handoff=1&':'')+'return='+encodeURIComponent('/foundry/');
 document.getElementById('go').href=target;location.replace(target);
})();
</script></body></html>
