  <text x="8" y="17" class="sub">SAME HELD OBJECT · IDENTIFY ≠ EMBED ≠ DEFORM · BODY NEVER CREATES AUTHORITY</text>
  <text x="8" y="25" class="law">6 STABLE SLOTS + HOLD FAST + LET FLY</text>
  <text x="8" y="31" class="sub">STACK = FOCUS · FAN = ≤3 REACHABLE MOVES · ANNULUS = CYCLIC VIEW · HOLD FAST = TEST/ARM · LET FLY = RUN→WITNESS→RETURN</text>
  <text x="319" y="10" class="sub">PRINT 100% / ACTUAL SIZE</text>
  <text x="319" y="16" class="sub">LEAF ≈ 186 mm · PIVOT Ø5 mm</text>
  <text x="319" y="22" class="sub">M4 / PAPER FASTENER · TIP LACE OPTIONAL</text>
