  <text x="8" y="10" class="head">FAN/8 · FIELD PHYSICAL PROJECTION · v0.1</text>
  <text x="8" y="17" class="sub">SAME HELD OBJECT · SHAPE CHANGES THE PROJECTION, NOT THE AUTHORITY</text>
  <text x="8" y="25" class="law">6 CYCLIC SLOTS + HOLD + LET FLY</text>
  <text x="8" y="31" class="sub">STACK = FOCUS · FAN = 1–3 REACHABLE MOVES · ANNULUS = CYCLIC RELATION · TWO COPIES = DUET · HOLD = TEST/ARM · LET FLY = RUN→WITNESS→RETURN</text>
  <text x="319" y="10" class="sub">PRINT 100% / ACTUAL SIZE</text>
  <text x="319" y="16" class="sub">LEAF ≈ 186 mm · PIVOT Ø5 mm</text>
  <text x="319" y="22" class="sub">M4 / PAPER FASTENER · TIP LACE OPTIONAL</text>
