  <g id="legend">
    <rect x="7" y="260" width="406" height="32" fill="#fffdf7" stroke="#111" stroke-width=".6"/>
    <text x="12" y="268" class="law">ONE SIX-SLOT ADDRESS · UNEQUAL READINGS</text>
    <text x="12" y="274" class="sub">TWO DIAL: circular distance Δ0 SAME→BLOOM · Δ1 NEAR→FOLD · Δ2 FAR→RETURN · Δ3 OPPOSITE→SPLIT</text>
    <text x="12" y="281" class="sub">HEX: SLOT 0–5 → LINE 1–6 · release writes SOLID for BLOOM/FOLD, BROKEN for SPLIT/RETURN.</text>
    <text x="12" y="288" class="sub">DAYLINE / FIELD: write ≤3 local moves. HOLD FAST one. LET FLY once. WITNESS → RETURN before repopulating.</text>
    <text x="314" y="268" class="law">IDENTIFY ≠ EMBED</text>
    <text x="314" y="274" class="sub">slot relation is logical.</text>
    <text x="314" y="281" class="sub">fan/wrap changes body only.</text>
    <text x="314" y="288" class="sub">000–111 are passive IDs.</text>
