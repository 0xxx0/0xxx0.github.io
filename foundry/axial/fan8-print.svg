    <text x="12" y="278" class="sub">RELATIVE CIRCULAR DISTANCE OVER SLOTS 0–5: Δ0 SAME→BLOOM · Δ1 NEAR→FOLD · Δ2 FAR→RETURN · Δ3 OPPOSITE→SPLIT</text>
    <text x="12" y="285" class="sub">DAYLINE / FIELD: write up to three current lawful moves on slot leaves; fold the rest behind. HOLD one. LET FLY once. Record witness / RETURN before choosing again.</text>
