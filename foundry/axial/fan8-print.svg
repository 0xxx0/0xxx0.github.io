<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>FAN/8 · physical projection profile</title>
  <desc>Eight printable brise-fan leaves: six stable addressed slots plus HOLD FAST and LET FLY. One passive physical projection for current INTERPHASE, AXIAL, FOLD//BLOOM and Dayline laws; no independent authority.</desc>
