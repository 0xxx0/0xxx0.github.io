<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080a0b"><title>DOCK / ORIENTATION</title>
<style>
:root{--bg:#080a0b;--ink:#edf0ed;--muted:#899499;--line:#30383c;--hot:#e87548;--cool:#7bbde5;--green:#98d6a2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:max(16px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom))}main{width:min(1120px,100%);margin:auto}
header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:28px 0 16px;border-bottom:1px solid var(--line)}
.ey{font-size:9px;letter-spacing:.18em;color:var(--hot)}h1{margin:8px 0 0;font:850 clamp(48px,11vw,104px)/.78 system-ui,-apple-system,sans-serif;letter-spacing:-.075em}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}a{color:#a8d7ff}nav a,button{border:1px solid var(--line);background:#0a0d0f;color:var(--ink);padding:7px 9px;text-decoration:none;font:9px ui-monospace,monospace}
.anchor{padding:22px 0 8px;font:700 clamp(18px,3vw,30px)/1.15 system-ui,-apple-system,sans-serif;letter-spacing:-.035em;max-width:950px}
.loop{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:16px 0}.loop span{background:#0a0d0f;padding:9px 5px;text-align:center;font-size:8px}.loop span:last-child{color:var(--green)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:6px;margin:26px 0 8px}.head b{font-size:10px;letter-spacing:.16em}.head span{color:var(--muted);font-size:9px}
.ladder,.fronts,.media{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}.ladder{grid-template-columns:repeat(5,1fr)}.step,.front,.medium{background:#0c1012;padding:13px}.step b,.front b,.medium b{display:block;font-size:10px;letter-spacing:.1em}.step strong{display:block;margin:14px 0 8px;font:800 20px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.03em}.step p,.front p,.medium p{margin:7px 0 0;color:#aab3b7;font:10px/1.5 system-ui,-apple-system,sans-serif}.exit{color:#76838a!important;font-size:9px!important}
.fronts{grid-template-columns:repeat(3,1fr)}.front .state{color:var(--green);font-size:8px;margin-top:5px}.media{grid-template-columns:repeat(2,1fr)}.medium{min-height:155px}.medium .op{color:var(--cool);font-size:9px;margin-top:8px}.medium .evidence{color:#8f9a9f;font-size:9px}
.handshake{counter-reset:x;display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}.handshake div{background:#0c1012;padding:10px 12px}.handshake div:before{counter-increment:x;content:counter(x,decimal-leading-zero);color:#69767c;margin-right:12px}.handshake b{color:var(--cool)}
.goal{border:1px solid var(--line);padding:14px;background:#0c1012}.goal code{display:block;margin-top:9px;white-space:normal;color:#cdd5d8}
.panic{border:1px solid #6a4a32;padding:14px}.panic b{color:#f0aa72}.panic ol{margin:8px 0 0;padding-left:22px;color:#b6c0c4}
footer{margin-top:28px;padding-top:9px;border-top:1px solid var(--line);color:#657177;font-size:8px}
@media(max-width:820px){header{grid-template-columns:1fr}nav{justify-content:flex-start}.loop{grid-template-columns:repeat(3,1fr)}.ladder,.fronts,.media{grid-template-columns:1fr}}
</style></head><body><main>
<header><div><div class="ey">WHERE / WHY / SCALE / RETURN</div><h1>DOCK</h1></div><nav><a href="../">FIELD INDEX</a><a href="../control/">CURRENT</a><a href="../control/migration/">MIGRATION</a><a href="../returns/">RETURN</a></nav></header>
<div id="app">Loading orientation…</div>
<footer>When lost: do not invent a bigger map. Find the scale, name the object, change one thing, obtain a receipt, then zoom out.</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
Promise.all([fetch('../control/ORIENTATION.json',{cache:'no-store'}).then(r=>r.json()),fetch('../control/QUEUE.json',{cache:'no-store'}).then(r=>r.json())]).then(([d,q])=>{
document.getElementById('app').innerHTML=
'<div class="anchor">'+esc(d.anchor.one_line)+'</div>'+
'<div class="loop">'+d.invariant_loop.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'+
'<div class="head"><div><b>SCALE LADDER</b><span>move up for meaning · move down for action</span></div></div>'+
'<section class="ladder">'+d.scale_ladder.map(x=>'<div class="step"><b>'+esc(x.scale)+'</b><strong>'+esc(x.question)+'</strong><p class="exit">'+esc(x.exit)+'</p></div>').join('')+'</section>'+
'<div class="head"><div><b>THREE LIVE FRONTS</b><span>everything else is held</span></div></div>'+
'<section class="fronts">'+q.live.map(x=>'<div class="front"><b>'+esc(x.id.toUpperCase())+'</b><div class="state">LIVE</div><p>'+esc(x.goal)+'</p><p class="exit">RECEIPT · '+esc(x.receipt)+'</p></div>').join('')+'</section>'+
'<div class="head"><div><b>ONE OPERATION / MANY MEDIA</b><span>surface differences · shared transformation grammar</span></div></div>'+
'<section class="media">'+d.media.map(x=>'<div class="medium"><b>'+esc(x.medium)+'</b><p>'+esc(x.state)+'</p><div class="op">'+esc(x.transform)+'</div><p class="evidence">EVIDENCE · '+esc(x.evidence)+'</p><p class="exit">PORTABLE · '+esc(x.portable)+'</p></div>').join('')+'</section>'+
'<div class="head"><div><b>DOCK HANDSHAKE</b><span>use whenever scale starts slipping</span></div></div>'+
'<section class="handshake">'+d.dock_handshake.map(x=>{let [a,...b]=x.split(' — ');return '<div><b>'+esc(a)+'</b> · '+esc(b.join(' — '))+'</div>'}).join('')+'</section>'+
'<div class="head"><div><b>GOAL CONTRACT</b><span>vague goals do not enter execution</span></div></div>'+
'<div class="goal"><b>REQUIRED · '+d.goal_contract.required.map(esc).join(' / ')+'</b><code>'+esc(d.goal_contract.template)+'</code></div>'+
'<div class="head"><div><b>IF WE ARE SPINNING</b><span>emergency scale correction</span></div></div>'+
'<div class="panic"><b>STOP FANOUT, NOT WORK.</b><ol>'+d.drift_response.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>';
}).catch(e=>document.getElementById('app').textContent='DOCK unavailable: '+e.message);
</script></main></body></html>
