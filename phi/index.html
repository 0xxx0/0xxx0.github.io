<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07090a">
<title>φ / FIELD URL</title>
<script src="/lib/interphase-ring.js"></script>
<script src="/lib/interphase-glyph.js"></script>
<style>
:root{--bg:#07090a;--p:#0b0f11;--p2:#101619;--ink:#edf0ed;--mut:#7d898f;--line:#2a3439;--hot:#ed7447;--cool:#72bce7;--green:#98d49b;--gold:#d5ad68;--bad:#cc8792}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font:10px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;cursor:pointer}code{font:inherit}#bar{z-index:2;border-bottom:1px solid var(--line);border-left:2px solid var(--hot);background:rgba(7,9,10,.97);box-shadow:0 8px 24px rgba(0,0,0,.3)}.main{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;min-height:48px}.glyph{width:44px;height:44px;display:grid;place-items:center;border-right:1px solid var(--line);overflow:hidden}.glyph svg{width:40px;height:40px}.fallback{font:800 20px/1 system-ui;color:var(--hot)}.read{padding:5px 8px;min-width:0}.ey{font-size:6px;letter-spacing:.14em;color:var(--hot)}.title{font:800 13px/1.05 system-ui,sans-serif;letter-spacing:-.025em;margin:2px 0}.addr{display:block;color:var(--cool);font-size:6.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ops{display:flex;align-self:stretch;overflow:auto}.op{width:50px;min-height:46px;display:grid;place-items:center;align-content:center;gap:1px;border-left:1px solid var(--line);color:var(--mut)}.op:hover,.op:focus-visible{background:var(--p2);color:var(--ink)}.op b{font:700 14px/1 ui-monospace,monospace;color:var(--ink)}.op span{font-size:5px;letter-spacing:.08em}.op[data-action="turn"] b{color:var(--hot)}.op[data-action="trace"] b{color:var(--green)}.op[data-action="handoff"] b{color:var(--gold)}.op[data-action="return"] b{color:var(--cool)}.meta,.help,.candidates,.packet,.error{border-top:1px solid var(--line);padding:4px 7px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--mut);font-size:5.8px}.meta b{color:var(--gold)}.meta code,.help code{color:var(--cool)}.help{color:var(--mut);font-size:6.4px}.help b{color:var(--ink);margin-right:7px}.candidates{display:flex;gap:2px;overflow:auto}.candidates>button{flex:0 0 auto;max-width:190px;padding:5px 7px;border:1px solid var(--line);background:var(--p);text-align:left}.candidates span{display:block;font-size:7px}.candidates code{display:block;margin-top:1px;color:var(--cool);font-size:5.5px}.packet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;color:var(--mut);font-size:6px}.packet b{display:block;color:var(--gold);font-size:6.5px;letter-spacing:.1em}.packet button{padding:5px 7px;border:1px solid var(--gold);color:var(--gold)}.error{color:var(--bad);font-size:7px}#field{display:block;width:100%;height:100%;border:0;background:var(--bg)}
@media(max-width:760px){.main{grid-template-columns:38px minmax(0,1fr)}.glyph{width:38px;height:38px}.glyph svg{width:35px;height:35px}.ops{grid-column:1/-1;border-top:1px solid var(--line)}.op{flex:1 0 46px;border-left:0;border-right:1px solid var(--line);min-height:38px}.meta{display:block}.meta span:last-child{display:none}.packet{grid-template-columns:1fr}.packet button{min-height:32px}}
</style>
</head>
<body>
<section id="bar" aria-label="FIELD URL operator"></section>
<iframe id="field" title="Canonical FIELD INDEX" src="/"></iframe>
<script type="module">
import {VERSION,parseCommand,commandFromSearch,resolveSelector,withCommand,describeRoute,handoffPacket} from '/field-urlbar-core.mjs';
const $=s=>document.querySelector(s),frame=$('#field');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const S={routes:[],heads:[],command:null,resolution:null,route:null,head:null,packet:null,error:null,framePath:'/'};
const sigil=a=>({hold:'◎',turn:'↗',trace:'∴',return:'↩',work:'▦',up:'↑',down:'↓',next:'→',prev:'←',visual:'⊙',structure:'≡',evolve:'⌁',versions:'↺',recent:'◴',axial:'│',handoff:'⇢'}[a]||'φ');
const label=a=>String(a||'hold').toUpperCase();
const headFor=r=>S.heads.find(h=>h?.route===r?.href)||null;
const hrefSlug=href=>String(href||'').replace(/^\/+|\/+$/g,'').split('/').filter(Boolean).pop()||'root';
function command(){return commandFromSearch(location.search)||{key:'f',...parseCommand('')}}
function glyph(){if(!S.route||!window.InterphaseGlyph)return'<span class="fallback">φ</span>';try{return window.InterphaseGlyph.svg(describeRoute(S.route,S.head),{size:140})}catch(_){return'<span class="fallback">φ</span>'}}
function commandURL(route,action='hold'){return location.pathname+withCommand(location.search,route,action,'f')}
function op(action,name=label(action)){return'<button class="op" type="button" data-action="'+esc(action)+'" title="'+esc(commandURL(S.route,action))+'"><b>'+sigil(action)+'</b><span>'+esc(name)+'</span></button>'}
function render(){
  const c=S.command||command(),r=S.route,res=S.resolution,empty=!commandFromSearch(location.search),mode=S.error?'ERROR':res?.state==='ambiguous'?'AMBIGUOUS':res?.state==='unresolved'?'UNRESOLVED':empty?'READY':label(c.action);
  const candidates=(res?.state==='ambiguous'||res?.state==='unresolved')?(res.candidates||[]):[];
  $('#bar').innerHTML='<div class="main"><div class="glyph">'+glyph()+'</div><div class="read"><div class="ey">φ URL · '+esc(mode)+' · AUTHORITY NONE</div><div class="title">'+esc(r?.title||r?.href||(empty?'FIELD INDEX':'NO MATCH'))+'</div><code class="addr">'+esc(r?commandURL(r,c.action):location.pathname+location.search)+'</code></div><div class="ops">'+(r?[op('hold','HOLD')+op('turn','TURN')+op('trace','TRACE')+op('work','WORK')+op('handoff','HANDOFF')+op('return','RETURN')]:'')+'</div></div>'+
  '<div class="meta"><span><b>⌘L / CTRL+L</b> → <code>/phi/?f=desk</code> · <code>?f=house:trace</code> · <code>?f=fold-bloom:turn</code></span><span>URL = projection state · FIELD below remains canonical</span></div>'+
  (empty?'<div class="help"><b>GRAMMAR</b> target[:verb] · HOLD TURN TRACE WORK HANDOFF RETURN · ↑/↓/←/→ via up/down/prev/next · visual/structure/evolve/versions/recent/axial.</div>':'')+
  (candidates.length?'<div class="candidates">'+candidates.map(x=>'<button type="button" data-route="'+esc(x.href)+'"><span>'+esc(x.title||x.href)+'</span><code>'+esc(x.href)+'</code></button>').join('')+'</div>':'')+
  (S.packet?'<div class="packet"><div><b>⇢ HANDOFF</b><span>'+esc(S.packet.object_ref||'—')+' · receiver owns acceptance, tool policy, mutation, undo and RETURN</span></div><button id="copyPacket" type="button">COPY PACKET</button></div>':'')+
  (S.error?'<div class="error">'+esc(S.error)+'</div>':'');
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>setCommand(S.route,b.dataset.action));
  document.querySelectorAll('[data-route]').forEach(b=>{b.onclick=()=>{const rr=S.routes.find(x=>x.href===b.dataset.route);if(rr)setCommand(rr,'hold')}});
  const cp=$('#copyPacket');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S.packet,null,2));cp.textContent='COPIED'}catch(_){cp.textContent='COPY FAILED'}};
}
function setCommand(route,action='hold'){
  history.pushState({schema:VERSION},'',location.pathname+withCommand(location.search,route,action,'f'));
  applyURL().catch(fail);
}
async function data(){
  const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.json()});
  const [m,c]=await Promise.all([get('/showcase-manifest.json'),get('/control/CURRENT.json')]);
  S.routes=Array.isArray(m.routes)?m.routes:[];S.heads=Array.isArray(c.current_heads)?c.current_heads:[];
}
function rootSrc(route){const p=new URLSearchParams();if(route?.href)p.set('focus',route.href);return '/'+(p.toString()?'?'+p.toString():'')}
function child(){try{return frame.contentWindow}catch(_){return null}}
function childPath(){try{return frame.contentWindow.location.pathname}catch(_){return null}}
async function childReady(){for(let i=0;i<120;i++){const w=child();if(w&&w.__fieldAct&&w.__fieldRouteMap)return w;await sleep(25)}return null}
function refocusFromChild(){
  const w=child(),href=w?.__fieldAct?.focusHref?.();if(!href)return null;
  const route=S.routes.find(r=>r.href===href);if(route){S.route=route;S.head=headFor(route);S.resolution={state:'resolved',selector:route.href,route,candidates:[route]}}return route;
}
async function enact(){
  const c=S.command,r=S.route;if(!c||!r)return;
  const path=childPath();S.framePath=path||S.framePath;
  if(path!=='/'&& !/\/index\.html?$/.test(path||'')){
    if(c.action==='return'||c.action==='hold'||c.action!=='turn'){frame.src=rootSrc(r);return}
    render();return;
  }
  const w=await childReady();if(!w){S.error='FIELD host in frame did not become ready';render();return}
  w.__fieldAct.focus(r.href);await Promise.resolve();
  switch(c.action){
    case'hold':break;
    case'turn':w.__fieldAct.open(r.href);return;
    case'trace':(w.document.querySelector('#runDockTrace')||w.document.querySelector('#apTrace'))?.click?.();break;
    case'work':{const d=w.document.querySelector('.workDepth');if(d){d.open=true;d.scrollIntoView?.({block:'start'})}break}
    case'return':break;
    case'up':w.__fieldAct.rise?.();refocusFromChild();history.replaceState({schema:VERSION},'',location.pathname+withCommand(location.search,S.route,'hold','f'));break;
    case'down':w.__fieldAct.dive?.();refocusFromChild();history.replaceState({schema:VERSION},'',location.pathname+withCommand(location.search,S.route,'hold','f'));break;
    case'next':w.__fieldAct.peer?.(1);refocusFromChild();history.replaceState({schema:VERSION},'',location.pathname+withCommand(location.search,S.route,'hold','f'));break;
    case'prev':w.__fieldAct.peer?.(-1);refocusFromChild();history.replaceState({schema:VERSION},'',location.pathname+withCommand(location.search,S.route,'hold','f'));break;
    case'visual':w.FieldLensHost?.project?.('VISUAL');break;
    case'structure':w.FieldLensHost?.project?.('STRUCTURE');break;
    case'evolve':w.FieldLensHost?.project?.('EVOLVE');break;
    case'versions':w.FieldLensHost?.project?.('VERSIONS');break;
    case'recent':w.FieldLensHost?.project?.('RECENT');break;
    case'axial':w.FieldLensHost?.project?.('AXIAL_LATEST');break;
    case'handoff':{
      let surface=null;try{surface=w.FieldIndexCarrier?.actionSurface?.()||null}catch(_){surface=null}
      S.packet=handoffPacket(r,surface);try{sessionStorage.setItem('field.urlbar.handoff.v01',JSON.stringify(S.packet))}catch(_){}break;
    }
  }
  render();
}
async function applyURL(){
  S.error=null;S.packet=null;S.command=command();
  const explicit=commandFromSearch(location.search);
  if(!explicit){S.resolution=null;S.route=null;S.head=null;frame.src='/';render();return}
  const res=resolveSelector(S.command.selector,S.routes,S.heads,null);S.resolution=res;S.route=res.route;S.head=headFor(res.route);render();
  if(res.state!=='resolved')return;
  const wanted=rootSrc(res.route),path=childPath();
  if(path===null||path!=='/'&& !/\/index\.html?$/.test(path)){frame.src=wanted;return}
  await enact();
}
function fail(e){S.error=String(e?.message||e);render()}
frame.addEventListener('load',()=>{S.framePath=childPath()||S.framePath;if(S.route)enact().catch(fail);else render()});
addEventListener('popstate',()=>applyURL().catch(fail));
await data();await applyURL();
</script>
</body>
</html>
