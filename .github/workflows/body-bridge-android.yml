name: body-bridge-android
on:
  pull_request:
    paths:
      - 'android/body-bridge/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile BODY BRIDGE debug APK
        run: gradle -p android/body-bridge :app:assembleDebug --stacktrace
      - name: Retain debug APK
        uses: actions/upload-artifact@v4
        with:
          name: body-bridge-debug
          path: android/body-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
