name: Publish FOLD BLOOM living field

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-fold-bloom-living.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Build living-field branch from stable 0.9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fold-bloom-living
          cp -R fold-bloom fold-bloom-living
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = ''
          root = Path('fold-bloom-living')
          (root / 'living.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          p = root / 'index.html'
          s = p.read_text()
          anchor = '    <script src="./app-runtime.js"></script>'
          if anchor not in s:
              raise SystemExit('app-runtime anchor missing')
          s = s.replace(anchor, anchor + '\n    <script src="./living.js"></script>')
          p.write_text(s)
          runtime = root / 'app-runtime.js'
          r = runtime.read_text()
          marker = "if ('serviceWorker' in navigator"
          if marker in r:
              r = r[:r.index(marker)].rstrip() + '\n'
              runtime.write_text(r)
          manifest = root / 'manifest.webmanifest'
          if manifest.exists():
              manifest.unlink()
          sw = root / 'sw.js'
          if sw.exists():
              sw.unlink()
          PY
          grep -q "CYCLIC-3" fold-bloom-living/living.js
          grep -q "living.js" fold-bloom-living/index.html
          node --check fold-bloom-living/living.js
      - name: Commit living-field experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold-bloom-living
          if git diff --cached --quiet; then
            echo 'Living field already current.'
            exit 0
          fi
          git commit -m 'Publish FOLD//BLOOM Living Field experiment [skip ci]'
          git push origin master
