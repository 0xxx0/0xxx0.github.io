name: open-pr-collision

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  collision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove collision classifier
        run: node tools/open-pr-collision-check.mjs --selftest
      - name: Refuse exact-file and hard-authority overlap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/open-pr-collision-check.mjs
      - name: Refuse unindexed standing-policy additions
        run: python3 scripts/pre-commit-search-check.py --policy-diff origin/master
