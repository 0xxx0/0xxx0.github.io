name: Browser Smoke Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/browser-smoke-diagnostic.yml'
      - 'tools/browser-smoke.mjs'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'package.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts >/dev/null
      - run: npx playwright install --with-deps chromium >/dev/null
      - name: Run browser smoke with compact failure output
        shell: bash
        run: |
          set +e
          npm run test:browser > /tmp/browser-smoke.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- failing cases ---'
            grep -E '^✗ |browser smoke failed|TimeoutError|Error:' /tmp/browser-smoke.log | tail -80 || true
            echo '--- failure tail ---'
            tail -80 /tmp/browser-smoke.log
          else
            echo 'browser smoke PASS'
          fi
          exit "$status"
