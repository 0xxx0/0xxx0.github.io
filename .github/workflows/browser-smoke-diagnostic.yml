name: Browser Smoke Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/browser-smoke-diagnostic.yml'
      - 'tools/browser-smoke.mjs'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_SLOW: "2"
      SMOKE_PORT: "43179"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run browser smoke with compact failure output
        shell: bash
        run: |
          set +e
          node tools/browser-smoke.mjs > /tmp/browser-smoke.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- failing cases ---'
            grep -E '^✗ |browser smoke failed|TimeoutError|Error:' /tmp/browser-smoke.log | tail -80 || true
            echo '--- failure tail ---'
            tail -80 /tmp/browser-smoke.log
          else
            echo 'browser smoke PASS'
          fi
          exit "$status"
