name: Publish FOLD BLOOM Ecology 0.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-fold-bloom.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore Ecology Instrument 0.2 as canonical FOLD BLOOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fold-bloom
          if grep -q 'SCALE LENS STUDIO' fold-bloom/index.html 2>/dev/null; then
            cp fold-bloom/index.html fold-bloom/rc11-scale-lens.html
          fi
          SRC='https://centre-mass-lab-3t78nd.v2.appdeploy.ai/experiments/fold-bloom-ecology/index.html'
          curl --fail --silent --show-error --location "$SRC" -o fold-bloom/index.html
          touch fold-bloom/.nojekyll
          test -s fold-bloom/index.html
          grep -q 'Ecology Instrument 0.2' fold-bloom/index.html
      - name: Commit restored canonical surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold-bloom/index.html fold-bloom/.nojekyll
          if [ -f fold-bloom/rc11-scale-lens.html ]; then git add fold-bloom/rc11-scale-lens.html; fi
          if git diff --cached --quiet; then
            echo 'Ecology 0.2 already canonical.'
            exit 0
          fi
          git commit -m 'Restore FOLD//BLOOM Ecology Instrument 0.2 as canonical [skip ci]'
          git push origin master
