name: FIELD AWAKE visor
on:
  pull_request:
    paths:
      - 'field-awake-visor.js'
      - 'tools/field-awake-visor-smoke.mjs'
      - '.github/workflows/field-awake-visor.yml'
      - 'index.html'
  push:
    branches: [master]
    paths:
      - 'field-awake-visor.js'
      - 'tools/field-awake-visor-smoke.mjs'
      - '.github/workflows/field-awake-visor.yml'
      - 'index.html'
permissions:
  contents: read
jobs:
  operable-visor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove AWAKE visor delegates canonical FIELD controls
        run: node tools/field-awake-visor-smoke.mjs
