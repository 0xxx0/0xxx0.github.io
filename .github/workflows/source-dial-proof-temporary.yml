name: source-dial-proof-temporary
on:
  push:
    branches: [fix/interphase-source-dial-tabs-20261025]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source dial laws
        run: |
          node --check interphase/continuum.mjs
          node --check field-work.mjs
          node tools/interphase-navigation-selftest.mjs
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/source-dial-proof" playwright
          "$RUNNER_TEMP/source-dial-proof/node_modules/.bin/playwright" install --with-deps chromium
      - name: Native source reader 320 390 1280 proof
        env:
          NODE_PATH: ${{ runner.temp }}/source-dial-proof/node_modules
        run: node tools/interphase-plus-smoke.mjs
