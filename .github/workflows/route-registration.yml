name: Route Registration
# A page that exists but is not in showcase-manifest.json is INVISIBLE —
# the FIELD INDEX feed renders the manifest, so an unregistered route never
# appears in LATEST / REPO TOUCHES no matter how new it is.
#
# This is the gate that keeps the index honest. It is the cheapest possible
# check (no deps, one node script) and it catches exactly the drift class we
# hit in practice: seven pages built, resolving, and invisible to the index.

on:
  push:
    branches: [master]
    paths:
      - 'showcase-manifest.json'
      - '**/*.html'
      - 'scripts/check-route-registration.mjs'
      - '.github/workflows/route-registration.yml'
  pull_request:
    paths:
      - 'showcase-manifest.json'
      - '**/*.html'
      - 'scripts/check-route-registration.mjs'
      - '.github/workflows/route-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the recency gate diffs HEAD~1..HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every live surface is registered
        run: node scripts/check-route-registration.mjs

      # Sibling failure to registration: a route that IS registered but whose
      # index.updated_at predates the last commit touching it. The FIELD INDEX
      # CATCH strip decides "changed" by that stamp, so stale bookkeeping makes
      # real work invisible on the surface the operator actually reads.
      # Measured 2026-09-28: newest stamp anywhere was 16:55 while commits had
      # landed through 19:45, and /house/ still claimed 09-26 from before its own
      # 0.7.7 release. Reuses the same derivation the fix command uses.
      - name: Check route recency (manifest not older than its commit)
        run: python3 tools/fi-mutation-contract.py --from-git HEAD~1..HEAD --check

      - name: Derive route ontology diagnostic (warnings only)
        run: node scripts/check-route-registration.mjs --ontology

      - name: Report archive vault (informational, never fails)
        if: always()
        run: node scripts/check-route-registration.mjs --all || true