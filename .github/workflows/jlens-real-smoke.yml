name: J-Lens Real Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/jlens-real-smoke.yml"
      - "fold-bloom/convergence/jspace-steering/real_model_smoke.py"

permissions:
  contents: read

jobs:
  real-jlens-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=5.5" huggingface_hub numpy
          python -m pip install --no-deps "git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e"
      - name: Fit and apply real Jacobian lens
        run: |
          python fold-bloom/convergence/jspace-steering/real_model_smoke.py --out-dir /tmp/jlens-real-smoke
      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: jlens-real-smoke
          path: /tmp/jlens-real-smoke/
          if-no-files-found: error
          retention-days: 14
