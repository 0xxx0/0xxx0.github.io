name: field-lab-native-media
on:
  pull_request:
    paths:
      - 'fold-bloom/lab/**'
      - 'fold-bloom/listen/app.js'
      - 'fold-bloom/listen/pcm-wav.js'
      - 'fold-bloom/live/track.js'
      - 'fold-bloom/live/app.js'
      - 'tools/source-spine-roundtrip-smoke.mjs'
      - 'tools/field-lab-native-media-smoke.mjs'
      - '.github/workflows/field-lab-native-media.yml'
  push:
    branches: [master]
    paths:
      - 'fold-bloom/lab/**'
      - 'fold-bloom/listen/app.js'
      - 'fold-bloom/listen/pcm-wav.js'
      - 'fold-bloom/live/track.js'
      - 'fold-bloom/live/app.js'
      - 'tools/source-spine-roundtrip-smoke.mjs'
      - 'tools/field-lab-native-media-smoke.mjs'
      - '.github/workflows/field-lab-native-media.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and prove source-bound host contract
        run: |
          node --check fold-bloom/lab/media-portal.js
          node --check fold-bloom/lab/source-spine.js
          node --check fold-bloom/listen/pcm-wav.js
          node --check fold-bloom/live/track.js
          node --check tools/source-spine-roundtrip-smoke.mjs
          node --test fold-bloom/lab/tests/source-spine.test.mjs
          node --test fold-bloom/listen/tests/deep-map-source-evidence.test.mjs
          node --check fold-bloom/lab/harmonic-evidence.js
          node --check fold-bloom/lab/app.js
          node --check fold-bloom/listen/app.js
          node --check tools/field-lab-native-media-smoke.mjs
          node --test fold-bloom/lab/tests/media-portal.test.mjs
          node --test fold-bloom/lab/tests/lab-return.test.mjs
          node --test fold-bloom/lab/tests/live-change-bridge.test.mjs
          node fold-bloom/listen/audio-glyph.test.mjs
      - name: Verify runner's preinstalled Chrome
        run: google-chrome --version
      - name: Native LAB phone-width interaction witness
        run: node tools/field-lab-native-media-smoke.mjs
      - name: Exact source spine and release roundtrip
        run: node tools/source-spine-roundtrip-smoke.mjs
