name: gitleaks

# Secret-scan gate: full-history scan on every push, PR, and a weekly sweep.
# Policy lives in /.gitleaks.toml (exact-value allowlists, each commented).
# Added 2026-09-28 by kestrel (W28 steal-adoption: gitleaks move).

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly full-history sweep (Mondays 05:23 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin: the policy file (.gitleaks.toml) is written against 8.30.1; the action's
          # hard-coded default (8.24.3) does not apply the [[allowlists]] config — measured
          # 2026-10-07: same repo, same config → 84 findings on 8.24.3 vs 2 on 8.30.1.
          GITLEAKS_VERSION: 8.30.1