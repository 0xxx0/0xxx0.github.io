name: READ-RIDE Exact Return

on:
  pull_request:
    paths:
      - "docs/index.html"
      - "fold-bloom/live/app.js"
      - "fold-bloom/read-course.js"
      - "fold-bloom/tests/read-course.test.mjs"
      - "tools/readfield-live-exact-return-smoke.mjs"
      - ".github/workflows/read-ride-exact-return.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure READ/RIDE invariants
        run: node fold-bloom/tests/read-course.test.mjs
      - name: Browser exact RETURN + adversarial rejection
        run: node tools/readfield-live-exact-return-smoke.mjs
