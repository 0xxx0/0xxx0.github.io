name: HOUSE Human Harness Proof

on:
  pull_request:
    paths:
      - 'house/human-harness.json'
      - 'house/human-harness.js'
      - 'house/two-worker-proof.json'
      - 'house/two-worker-proof.js'
      - 'house/crew-card.json'
      - 'tools/house-human-harness-selftest.mjs'
      - 'tools/house-two-worker-proof-selftest.mjs'
      - '.github/workflows/house-human-harness-proof.yml'
  push:
    branches: [master]
    paths:
      - 'house/human-harness.json'
      - 'house/human-harness.js'
      - 'house/two-worker-proof.json'
      - 'house/two-worker-proof.js'
      - 'house/crew-card.json'
      - 'tools/house-human-harness-selftest.mjs'
      - 'tools/house-two-worker-proof-selftest.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse machine contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('house/human-harness.json')); JSON.parse(require('fs').readFileSync('house/two-worker-proof.json')); JSON.parse(require('fs').readFileSync('house/crew-card.json')); console.log('machine contracts parse')"
      - name: Test ENV-0 human harness state machine
        run: node tools/house-human-harness-selftest.mjs
      - name: Test CREW SEAM two-worker packet proof
        run: node tools/house-two-worker-proof-selftest.mjs
      - name: Boundary scan
        run: |
          ! grep -Eirn --include='human-harness*.js' --include='two-worker-proof*.js' '(home_assistant_url|long_lived_access_token|Authorization: Bearer|api[_-]?key|password[[:space:]]*=)' house
          ! grep -Eirn --include='two-worker-proof*.json' --include='human-harness*.json' '"(conversation|transcript|messages|chat_history|raw_context|credentials|token|secret)"[[:space:]]*:' house
