name: collision-preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  collision-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare changed surfaces with open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/collision-preflight.mjs
