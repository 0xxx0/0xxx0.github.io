name: public-surface-check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate LensState laws and round trip
        run: node control/lens-state-selftest.js
      - name: Validate Lens proof bench syntax
        run: node --check lens-proof.js
      - name: Validate shared Constraint Surface parity
        run: node control/constraint-surface-selftest.js
      - name: Validate route grammar
        run: node tools/audit-route-grammar.mjs
      - name: Validate ingest context locator
        run: |
          python3 -m py_compile scripts/locate-ingest-context.py
          python3 control/ingest-context-locator-selftest.py
      - name: Validate HUMAN PORT object aperture
        run: node control/human-port-object-selftest.js
      - name: Test HUMAN PORT COMMS SPINE 0.1
        run: |
          node --test port/comms/tests/core.test.mjs
          node tools/comms-spine-smoke.mjs
      - name: Validate BODY FIT Health Connect transform
        run: node body/fit/health-connect-selftest.cjs
      - name: Validate INTERPHASE ROOM projection core
        run: node control/interphase-room-selftest.js
      - name: Validate CONFLUENCE one-instrument round trip
        run: node spikes/003-one-instrument/selftest.mjs
      - name: Validate shared INTERPHASE host laws
        run: node tools/interphase-selftest.cjs
      - name: Validate SPIKE 005 / expression transcript
        run: node spikes/005-expression-transcript/selftest.mjs
      - name: Validate INTERPHASE successor handoff
        run: node tools/interphase-successor-selftest.cjs
      - name: Validate shared INTERPHASE glyph laws
        run: |
          node tools/interphase-glyph-selftest.cjs
          node tools/interphase-dom-form-selftest.cjs
          node tools/interphase-ring-selftest.cjs
      - name: Validate INTERPHASE correspondence + archaeology packet
        run: |
          node --check lib/interphase-mapping.js
          node --check lib/interphase-recovery.js
          node tools/interphase-mapping-selftest.cjs
          node -e "JSON.parse(require('fs').readFileSync('control/INTERPHASE_MAPPING_CONTRACT.json','utf8')); JSON.parse(require('fs').readFileSync('control/schemas/interphase-recovery-packet.schema.json','utf8')); console.log('INTERPHASE mapping contracts PASS')"
      - name: Validate HARD EVOLUTION P1 P2 P3 proofs
        run: node spikes/007-hard-evolution-proofs/selftest.mjs
      - name: Validate FOLD BLOOM message replay H1 specimen
        run: |
          node --check spikes/fold-bloom-message-replay-001/score.js
          node --check spikes/fold-bloom-message-replay-001/app.js
          node spikes/fold-bloom-message-replay-001/selftest.mjs
      - name: Validate INTERPHASE extension bundle syntax
        run: |
          node --check interphase-extension.js
          node --check lib/interphase-core.js
          node --check lib/interphase-dom.js
          node --check lib/interphase-glyph.js
          node --check lib/interphase-field.js
          node --check lib/interphase-readfield.js
          node --check lib/interphase-lens.js
          node --check lib/interphase-listen.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('INTERPHASE manifest PASS')"
      - name: Validate BLOCK ROOM space-scale core
        run: node control/space-scale-selftest.js
      - name: Validate static surface contracts
        run: node tools/validate-public.mjs
      - name: Validate Triangle FORM rewrite core
        run: node tools/triangle-form-selftest.mjs
      - name: Test LISTEN analysis + stream lens
        run: |
          node fold-bloom/listen/selftest.mjs
          node --test fold-bloom/listen/audio-glyph.test.mjs fold-bloom/listen/id3.test.mjs fold-bloom/listen/tests/source-bundle.test.mjs fold-bloom/listen/tests/source-bundle-contract.test.mjs fold-bloom/atlas/atlas-core.test.mjs fold-bloom/atlas/document-source.test.mjs
          node fold-bloom/listen/stream-lens.test.mjs
          node fold-bloom/listen/source-adapters.test.mjs
      - name: Test FOLD BLOOM unified support over INTERPHASE
        run: node --test fold-bloom/tests/instrument-support.test.mjs
      - name: Test FOLD BLOOM Experience Set v0.1 round trip
        run: node --test fold-bloom/experience-set/tests/experience-set.test.mjs
      - name: Test FOLD BLOOM Set Compositor 0.1.1 + local test packs
        run: node --test fold-bloom/set/tests/set-core.test.mjs fold-bloom/test-packs/tests/test-pack-core.test.mjs
      - name: Test FOLD BLOOM local source spine + Journey Ride 0.1.2
        run: node --test fold-bloom/tests/local-media-store.test.mjs fold-bloom/journey/tests/journey-core.test.mjs fold-bloom/journey/tests/demo-seed.test.mjs
      - name: Test FOLD BLOOM event tape + Beat Saber pack adapter
        run: node --test fold-bloom/beat/tests/event-tape.test.mjs fold-bloom/beat/tests/beatsaber-pack.test.mjs fold-bloom/tests/convergence-surface.test.mjs
      - name: Test FOLD BLOOM SABER dual-phone core
        run: node --test fold-bloom/saber/tests/saber-core.test.mjs
      - name: Test FOLD BLOOM Lab READ + LOCI bridges
        run: node --test fold-bloom/lab/tests/read-bridge.test.mjs fold-bloom/lab/tests/course.test.mjs fold-bloom/lab/tests/pulse-routing.test.mjs
      - name: Test FOLD BLOOM VOICE pitch core
        run: |
          node --check fold-bloom/voice/pitch.js
          node --check fold-bloom/voice/app.js
          node --test fold-bloom/voice/tests/pitch.test.mjs
      - name: Test FOLD BLOOM wet-media ink engine
        run: node --test fold-bloom/ink/tests/ink-engine.test.mjs
      - name: Test unified FOLD BLOOM RIDE state
        run: node --test fold-bloom/ride/tests/ride-state.test.mjs
      - name: Test LISTEN preview render
        env:
          SMOKE_ONLY: FOLD BLOOM LISTEN preview render
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM local vault cross-surface handoff
        run: node tools/fold-bloom-spine-smoke.mjs
      - name: Test FOLD BLOOM LISTEN phone continuity with real MP3
        run: node tools/fold-bloom-listen-phone-smoke.mjs
      - name: Test FOLD BLOOM LIVE gameplay + track + section arcs + TRACKFIELD deformation + ride
        run: node --test fold-bloom/live/tests/engine.test.mjs fold-bloom/live/tests/track.test.mjs fold-bloom/live/tests/section-arc.test.mjs fold-bloom/live/tests/trackfield.test.mjs fold-bloom/live/tests/practice-track.test.mjs fold-bloom/live/tests/track-deform.test.mjs fold-bloom/live/tests/ride.test.mjs fold-bloom/live/tests/pov-effects.test.mjs fold-bloom/live/tests/visual-worlds.test.mjs fold-bloom/live/tests/projection-smoothing.test.mjs fold-bloom/live/tests/set-ride-core.test.mjs
      - name: Test FOLD BLOOM FIELD LAB browser boot
        env:
          SMOKE_ONLY: FOLD BLOOM FIELD LAB
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM INK FIELD browser boot
        env:
          SMOKE_ONLY: FOLD BLOOM INK FIELD
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM shareable demo launch
        env:
          SMOKE_ONLY: FOLD BLOOM LIVE shareable demo
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM module browser boot
        env:
          SMOKE_ONLY: FOLD BLOOM module boot
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM INTERPHASE host browser boot
        env:
          SMOKE_ONLY: FOLD BLOOM INTERPHASE host boot
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM instrument readiness
        env:
          SMOKE_ONLY: FOLD BLOOM instrument ready
        run: node tools/browser-smoke.mjs
      - name: Test FOLD BLOOM unified root browser
        env:
          SMOKE_ONLY: FOLD BLOOM convergence
        run: node tools/browser-smoke.mjs
      - name: Run critical browser smoke
        run: node tools/browser-smoke.mjs
      - name: Validate recovered source identities and media catalogue
        run: node tools/verify-backup-recovery.mjs
      - name: Test frozen City engines and Painting handlers
        working-directory: recovery/sleeper/site-source-2026-09-18
        run: node --experimental-strip-types --test tests/field-engines.test.mjs tests/painting-path.test.mjs tests/painting-ui.test.mjs
