name: public-surface-check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate LensState laws and round trip
        run: node control/lens-state-selftest.js
      - name: Validate Lens proof bench syntax
        run: node --check lens-proof.js
      - name: Validate shared Constraint Surface parity
        run: node control/constraint-surface-selftest.js
      - name: Validate static surface contracts
        run: node tools/validate-public.mjs
      - name: Run critical browser smoke
        run: node tools/browser-smoke.mjs
      - name: Validate recovered source identities and media catalogue
        run: node tools/verify-backup-recovery.mjs
      - name: Test frozen City engines and Painting handlers
        working-directory: recovery/sleeper/site-source-2026-09-18
        run: node --experimental-strip-types --test tests/field-engines.test.mjs tests/painting-path.test.mjs tests/painting-ui.test.mjs
