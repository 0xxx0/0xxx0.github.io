name: Publish Atlas Dayline static snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-atlas-dayline.yml'
      - 'releases/atlas-dayline-i.part-*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Materialize Atlas Dayline release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum releases/atlas-dayline-i.part-*
          echo 'expected:'
          echo 'd58c12f141f5067195a88ce5b5b3bc2fddf24799796dc4cc04c86fc366a48839 part-00'
          echo '257eee0604b8f2a7292c3353ede92f18c493963192ad4ac82e497c727ece8cd2 part-01'
          echo '60093253a13f44c9ac249a3ce2a760e60544ed34229235549a0af55d5a279518 part-02'
          echo 'cf4e6629a6c63a42e0ad2ee51c11bbfdba83caf89f5684b80cc1905f2d3076ab part-03'
          echo 'cb1805da7612b626bba77795fc48ca65c5759a75d28ecda7659d9086b61bc108 part-04'
          rm -rf atlas-dayline
          mkdir -p atlas-dayline
          cat releases/atlas-dayline-i.part-* > /tmp/atlas-dayline-i.b64
          test "$(wc -c < /tmp/atlas-dayline-i.b64)" -eq 37192
          echo 'a0613a1409f06ca845c3d08727f403c217777b1326d3dbe87a1e1fb622a67018  /tmp/atlas-dayline-i.b64' | sha256sum -c -
          base64 -d /tmp/atlas-dayline-i.b64 > /tmp/atlas-dayline-i.tar.xz
          echo 'a4e4ed79b0fb7bfbfba568b71c6d9780388ca97c5e975bff639ad5ecc11e9ccb  /tmp/atlas-dayline-i.tar.xz' | sha256sum -c -
          xz -dc /tmp/atlas-dayline-i.tar.xz | tar -xf - -C atlas-dayline
          touch atlas-dayline/.nojekyll
          test -s atlas-dayline/index.html
          test -s atlas-dayline/app.js
          test -s atlas-dayline/app.css
          grep -q 'ATLAS DAYLINE I' atlas-dayline/index.html
          grep -q 'TIDE / OPPORTUNITY FORECAST' atlas-dayline/app.js
          grep -q 'RUN FIT / ROBUSTNESS' atlas-dayline/app.js
          grep -q 'LOCAL-ONLY' atlas-dayline/index.html
          ! grep -Eiq 'kiwi|wesleyan|nngs|bendemeer|mac mini|ves +' atlas-dayline/index.html atlas-dayline/app.js
      - name: Commit stable GitHub Pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+0xxx0@users.noreply.github.com'
          git add atlas-dayline
          if git diff --cached --quiet; then
            echo 'Atlas Dayline snapshot already current.'
            exit 0
          fi
          git commit -m 'Publish Atlas Dayline I static snapshot [skip ci]'
          git pull --rebase origin master
          git push origin master
