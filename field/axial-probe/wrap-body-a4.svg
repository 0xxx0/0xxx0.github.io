<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><rect width="297" height="210" fill="#fff"/><style>.cut{fill:none;stroke:#000;stroke-width:.35}.guide{fill:none;stroke:#777;stroke-width:.22;stroke-dasharray:2 1.5}.mark{stroke:#000;stroke-width:.35}.small{font-family:monospace;font-size:2.5px;fill:#000}.tiny{font-family:monospace;font-size:2.1px;fill:#000}.bold{font-family:monospace;font-size:3.6px;font-weight:bold;fill:#000}</style><text class="bold" x="12" y="8">AXIAL / WRAP BODY 0.1 — paper-only mechanical surrogate</text><text class="small" x="12" y="13">PRINT 100% / ACTUAL SIZE. Calibration must read 99–101 mm.</text><g id="core"><rect id="core-body" class="cut" x="12" y="20" width="160" height="90"/><rect id="core-tab" class="guide" x="172" y="20" width="8" height="90"/><text class="small" x="174" y="65" transform="rotate(90 174 65)">TAPE TAB</text><line id="ring-gate" class="mark" x1="92" y1="20" x2="92" y2="29"/><path d="M89.5 26 L92 29 L94.5 26" fill="none" stroke="#000" stroke-width=".35"/><text class="tiny" x="92" y="33" text-anchor="middle">FIXED RING GATE</text><line id="axis-slit-a" class="mark" x1="52" y1="51" x2="52" y2="65"/><line id="axis-slit-b" class="mark" x1="132" y1="51" x2="132" y2="65"/><text class="tiny" x="52" y="49" text-anchor="middle">CUT SLOT</text><text class="tiny" x="132" y="49" text-anchor="middle">CUT SLOT</text><g id="depth-scale"><line id="depth-4" class="mark" x1="88" y1="75" x2="96" y2="75"/><text class="tiny" x="98" y="76">4</text><line id="depth-3" class="mark" x1="88" y1="82" x2="96" y2="82"/><text class="tiny" x="98" y="83">3</text><line id="depth-2" class="mark" x1="88" y1="89" x2="96" y2="89"/><text class="tiny" x="98" y="90">2</text><line id="depth-1" class="mark" x1="88" y1="96" x2="96" y2="96"/><text class="tiny" x="98" y="97">1</text><line id="depth-0" class="mark" x1="88" y1="103" x2="96" y2="103"/><text class="tiny" x="98" y="104">0</text><text class="tiny" x="106" y="90" transform="rotate(90 106 90)">CYLINDER / SLIDE ↑</text></g><text class="small" x="16" y="106">ROLL BODY EDGE→EDGE; tape only on tab. Nominal Ø ≈ 50.9 mm.</text></g><g id="ring-band"><rect id="ring-body" class="cut" x="12" y="120" width="160" height="18"/><rect id="ring-tab" class="guide" x="172" y="120" width="6" height="18"/><text class="tiny" x="175" y="130" text-anchor="middle" transform="rotate(90 175 130)">TAB</text><line class="guide" x1="32" y1="120" x2="32" y2="138"/><line class="guide" x1="52" y1="120" x2="52" y2="138"/><line class="guide" x1="72" y1="120" x2="72" y2="138"/><line class="guide" x1="92" y1="120" x2="92" y2="138"/><line class="guide" x1="112" y1="120" x2="112" y2="138"/><line class="guide" x1="132" y1="120" x2="132" y2="138"/><line class="guide" x1="152" y1="120" x2="152" y2="138"/><text id="ring-detent-0" class="bold" x="22" y="131" text-anchor="middle">0</text><text id="ring-detent-1" class="bold" x="42" y="131" text-anchor="middle">1</text><text id="ring-detent-2" class="bold" x="62" y="131" text-anchor="middle">2</text><text id="ring-detent-3" class="bold" x="82" y="131" text-anchor="middle">3</text><text id="ring-detent-4" class="bold" x="102" y="131" text-anchor="middle">4</text><text id="ring-detent-5" class="bold" x="122" y="131" text-anchor="middle">5</text><text id="ring-detent-6" class="bold" x="142" y="131" text-anchor="middle">6</text><text id="ring-detent-7" class="bold" x="162" y="131" text-anchor="middle">7</text><text class="tiny" x="12" y="117">RING / TWIST — close loosely; loop must rotate around core.</text></g><g id="depth-sleeve"><rect id="sleeve-body" class="cut" x="12" y="146" width="160" height="14"/><rect id="sleeve-tab" class="guide" x="172" y="146" width="6" height="14"/><path id="sleeve-pointer" d="M89 146 L92 151 L95 146 Z" fill="#000"/><text class="tiny" x="12" y="143">CYLINDER / SLIDE — close loosely; pointer aligns 0…4 on core.</text></g><g id="axis-slider"><rect id="axis-body" class="cut" x="188" y="20" width="98" height="12"/><line id="axis-mark-neg" class="mark" x1="207" y1="20" x2="207" y2="32"/><line id="axis-mark-zero" class="mark" x1="237" y1="20" x2="237" y2="32"/><line id="axis-mark-pos" class="mark" x1="267" y1="20" x2="267" y2="32"/><text class="bold" x="207" y="28" text-anchor="middle">−1</text><text class="bold" x="237" y="28" text-anchor="middle">0</text><text class="bold" x="267" y="28" text-anchor="middle">+1</text><text class="tiny" x="188" y="17">AXIS / SHIFT — pass through both opposed slots; slot edge is read gate.</text></g><g id="build-card"><rect class="cut" x="188" y="42" width="98" height="68"/><text class="bold" x="192" y="49">BUILD / 4 MOVES</text><text class="small" x="192" y="56">1 CUT core + 2 slots + 3 loose parts.</text><text class="small" x="192" y="62">2 ROLL core: 160 mm body + 8 mm tab.</text><text class="small" x="192" y="68">3 LOOP ring + sleeve around core.</text><text class="small" x="192" y="74">4 PASS axis strip through opposed slots.</text><text class="tiny" x="192" y="82">Home = R0 · C0 · A0. Screen not required to read home.</text><text class="tiny" x="192" y="90">Necessary condition: each coordinate moves without forcing</text><text class="tiny" x="192" y="95">either of the other two coordinates to change.</text></g><g id="validation-card"><rect class="cut" x="188" y="116" width="98" height="70"/><text class="bold" x="192" y="123">VALIDATE / SAME DIGITAL LAW</text><text class="small" x="192" y="130">A · closure</text><text class="tiny" x="192" y="136">R+2 → C+1 → A−1 → R−2 → C−1 → A+1</text><text class="tiny" x="192" y="141">PASS: return exactly to [0,0,0].</text><text class="small" x="192" y="149">B · same state / different path</text><text class="tiny" x="192" y="155">α: R+2 → C+2 → A+1</text><text class="tiny" x="192" y="160">β: A+1 → C+2 → R+2</text><text class="tiny" x="192" y="165">PASS: both end at visible [2,2,+1].</text><text class="tiny" x="192" y="173">KEEP: home + endpoint photos; note coupling, slip,</text><text class="tiny" x="192" y="178">ambiguity or accidental coordinate change.</text></g><line id="calibration-100mm" class="mark" x1="188" y1="200" x2="288" y2="200"/><line class="mark" x1="188" y1="197" x2="188" y2="203"/><line class="mark" x1="288" y1="197" x2="288" y2="203"/><text class="small" x="238" y="196" text-anchor="middle">100 mm CALIBRATION · acceptable 99–101 mm</text></svg>