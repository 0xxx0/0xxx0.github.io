<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132">
  <!-- xkcd / why's-poignant-guide line cat. ink strokes, wobble on purpose. -->
  <g fill="none" stroke="#eef2ef" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- loaf body -->
    <path d="M28 96 C21 78 27 62 42 57 C52 54 70 55 81 61 C93 68 96 82 92 96 C90 102 82 105 63 106 C44 107 32 103 28 96 Z"/>
    <!-- head -->
    <path d="M38 58 C31 50 28 38 33 30 C37 24 47 22 57 24 C71 27 78 36 76 47 C75 55 68 61 57 62 C49 63 42 61 38 58 Z"/>
    <!-- ears (deliberately unequal) -->
    <path d="M33 31 C29 23 27 13 30 11 C34 9 41 17 44 23"/>
    <path d="M66 23 C69 13 76 6 79 8 C83 11 79 22 77 27"/>
    <!-- eyes: dots, slightly off-level -->
    <path d="M45 41 L45.6 41 M64 40 L64.6 40" stroke-width="4.2"/>
    <!-- nose + mouth -->
    <path d="M54.3 47 L56.7 47 L55.4 49.4 Z" stroke-width="1.9"/>
    <path d="M55.4 49.4 C55 52 52 53 50.4 51.6 M55.4 49.4 C56 52 59 53 60.6 51.4" stroke-width="1.7"/>
    <!-- whiskers -->
    <path d="M39 46 C31 44 24 43 18 42 M39 49 C31 50 25 51 19 52 M72 45 C80 43 87 42 93 41 M72 48 C80 49 86 51 92 53" stroke-width="1.5"/>
    <!-- paws -->
    <path d="M42 104 C41 99 43 95 47 95 C51 95 52 100 51 105 M62 105 C61 100 63 96 67 96 C71 96 72 101 71 106" stroke-width="1.9"/>
    <!-- tail, curled -->
    <path d="M92 92 C103 91 111 83 108 72 C106 64 96 61 91 67" stroke-width="2.3"/>
    <!-- contentment lines -->
    <path d="M20 20 L15 12 M27 16 L25 7" stroke-width="1.4"/>
  </g>
  <!-- the caption, hand-quiet -->
  <text x="60" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="10.5" fill="#eef2ef" opacity=".85">it does not judge.</text>
</svg>
