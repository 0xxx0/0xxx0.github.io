<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070b"><title>FOLD//BLOOM FIELD</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070b;color:#f4f6fa;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:8px;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid #202630;background:rgba(5,7,11,.9)}.brand{font-size:10px;letter-spacing:.18em;font-weight:900}.status{margin-left:auto;font-size:9px;color:#91a0b0}iframe{width:100%;height:100%;border:0}.hint{font-size:10px;color:#91a0b0;padding:0 10px 8px;background:rgba(5,7,11,.9)}</style></head><body><div class="shell"><div class="bar"><span class="brand">FIELD</span><span class="status" id="status">LOCAL LINK READY</span></div><div class="hint">This page owns the full organism. Open <a href="hand.html" style="color:inherit">HAND</a> in another tab/window for the stripped-down control projection.</div><iframe id="game" src="index.html" title="FOLD BLOOM FIELD"></iframe></div><script>(()=>{"use strict";const $=s=>document.querySelector(s), bc=new BroadcastChannel('foldbloom-hand-field'); let api=null, unsub=null, timer=0; function attach(){try{api=$('#game').contentWindow.FoldBloom}catch(_){api=null} if(!api)return; unsub?.(); if(api.on)unsub=api.on(e=>bc.postMessage({from:'field',type:'event',data:e})); clearInterval(timer); timer=setInterval(sendState,120); sendState()} function sendState(){if(!api)return; const p=api.projection?.()||api.state?.(); bc.postMessage({from:'field',type:'state',data:p})} bc.onmessage=e=>{const m=e.data;if(!m||m.from==='field'||!api)return; if(m.type==='step')api.step?.(m.data.dir); else if(m.type==='pace')api.setPace?.(m.data.value); else if(m.type==='garden')api.garden?.(m.data.on); else if(m.type==='request')sendState()}; $('#game').addEventListener('load',attach);})();</script></body></html>
