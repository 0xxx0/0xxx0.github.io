      if (typeof DecompressionStream === 'undefined') throw new Error('DecompressionStream unavailable');
      const b = Uint8Array.from(atob(p.join('')), c => c.charCodeAt(0));
      const timer = setTimeout(() => fail('load timeout'), 5000);
      new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(h => {
        clearTimeout(timer);
        const nav = '<script src="/showcase-nav.js"><\\/script>';\n        h = h.includes('</body>') ? h.replace('</body>', nav + '</body>') : h + nav;\n        document.open(); document.write(h); document.close();
      }).catch(e => { clearTimeout(timer); fail(e); });
    } catch (e) { fail(e); }
  </script>
</body>
