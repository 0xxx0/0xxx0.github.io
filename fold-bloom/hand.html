<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070a0e"><title>FOLD//BLOOM HAND</title><style>:root{color-scheme:dark;--bg:#070a0e;--fg:#f4f7fb;--mut:#8894a4;--line:#252d38}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));gap:8px}.top{display:flex;align-items:center;gap:8px}.brand{font-size:10px;letter-spacing:.18em;font-weight:900}.status{margin-left:auto;font-size:9px;color:var(--mut)}button,input{font:inherit;color:inherit;background:#0b0e13;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 10px}.stage{border:1px solid var(--line);border-radius:28px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.06), transparent 48%),#0c1016}.dial{height:100%;min-height:52vh;display:grid;place-items:center;text-align:center;padding:26px}.chapter{font-size:12px;letter-spacing:.08em;color:var(--mut)}.score{font:700 clamp(26px,10vw,54px)/1 system-ui;letter-spacing:-.05em}.shape{font:700 clamp(84px,24vw,150px)/1 system-ui;transition:transform .12s}.shape.pulse{transform:scale(1.06)}.chain{font-size:11px;letter-spacing:.14em;color:var(--mut)}.side{position:absolute;top:50%;transform:translateY(-50%);font:700 34px/1 system-ui;color:rgba(255,255,255,.18)}.l{left:18px}.r{right:18px}.controls,.secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{grid-template-columns:1fr 1fr 1fr}.pace{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:0 10px}.pace input{padding:0;min-height:0;border:0;background:transparent}.hint{font-size:9px;color:var(--mut);line-height:1.5;text-align:center}a{color:inherit}</style></head><body><div class="app"><div class="top"><span class="brand">HAND</span><span class="status" id="status">LOCAL LINK</span></div><div class="stage" id="stage"><div class="dial"><div class="chapter" id="chapter">WAITING FOR FIELD</div><div class="score" id="score">0 FLOW</div><div class="shape" id="shape">○</div><div class="chain" id="chain">—</div><div class="chain" id="queue">NEXT —</div><div class="chain" id="pressure">PRESS —</div><div class="chain" id="scope">SCOPE —</div><span class="side l">‹</span><span class="side r">›</span></div></div><div><div class="controls"><button id="left">STEP LEFT</button><button id="right">STEP RIGHT</button></div><div class="secondary"><button id="garden">GARDEN</button><button id="request">REFRESH</button><label class="pace"><span>PACE</span><input id="pace" type="range" min="55" max="160" value="100"><b id="paceVal">1.00×</b></label></div></div><div class="hint">Open <a href="field.html">FIELD</a> in another tab/window first. This page receives state and sends simple step / pace / garden operations using BroadcastChannel.</div></div><script>(()=>{"use strict";const $=s=>document.querySelector(s), bc=new BroadcastChannel('foldbloom-hand-field'); let state=null,dragX=null,lastDetent=0; const glyph=n=>['○','□','△'][Number(n||0)%3]; function tone(freq=320){try{const A=window.AudioContext||window.webkitAudioContext,a=window.__h||(window.__h=new A()),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.02,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.045);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.05)}catch(_){}} function haptic(p=8){try{navigator.vibrate?.(p)}catch(_){}} function send(type,data={}){bc.postMessage({from:'hand',type,data,at:Date.now()})} function render(){if(!state)return; $('#chapter').textContent=`${state.chapter||'—'} · ${state.law||'—'}`; $('#score').textContent=`${Number(state.score||0).toLocaleString()} FLOW · ${state.combo||1}×`; $('#shape').textContent=state.seed?glyph(state.seed.type):'·'; $('#chain').textContent=state.aligned?(state.chain>1?`${state.chain}× READY`:'LOCKED'):(state.seed?'SEEK':'—'); $('#queue').textContent='NEXT '+((state.queue||[]).slice(0,4).map(glyph).join(' ')||'—'); const p=(state.pressure||[])[0]; $('#pressure').textContent='PRESS '+(p?glyph(p.type)+(p.imbalance>=0?'+':'')+Number(p.imbalance).toFixed(1):'—'); $('#scope').textContent='SCOPE '+(['LETTER','WORD','PHRASE','SENTENCE','PARAGRAPH','SECTION','CHAPTER','BOOK','LIBRARY'][state.scope||0]||'—')+' · '+(state.domain||'TEXT'); $('#pace').value=Math.round((state.pace||1)*100); $('#paceVal').textContent=(state.pace||1).toFixed(2)+'×'; $('#garden').textContent=state.garden?'TAKE HAND':'GARDEN'} function step(dir){send('step',{dir}); tone(dir>0?360:320); haptic(7)} bc.onmessage=e=>{const m=e.data;if(!m||m.from==='hand')return; if(m.type==='state'){state=m.data; render()} else if(m.type==='event'){const ev=m.data;if(ev.kind==='BLOOM'){const sh=$('#shape'); sh.classList.add('pulse'); setTimeout(()=>sh.classList.remove('pulse'),150); haptic(Math.min(35,8+(ev.chain||1)*4)); tone(440+(ev.type||0)*65)} else if(ev.kind==='DRIFT')tone(170)}}; $('#left').onclick=()=>step(-1); $('#right').onclick=()=>step(1); $('#request').onclick=()=>send('request',{}); $('#garden').onclick=()=>send('garden',{on:!(state?.garden)}); $('#pace').oninput=e=>{$('#paceVal').textContent=(e.target.value/100).toFixed(2)+'×'}; $('#pace').onchange=e=>send('pace',{value:e.target.value/100}); $('#stage').addEventListener('pointerdown',e=>{dragX=e.clientX; lastDetent=e.clientX; $('#stage').setPointerCapture?.(e.pointerId)}); $('#stage').addEventListener('pointermove',e=>{if(dragX==null)return; const threshold=Math.max(28,innerWidth*.075),d=e.clientX-lastDetent; if(Math.abs(d)>=threshold){step(d>0?1:-1); lastDetent=e.clientX}}); $('#stage').addEventListener('pointerup',()=>{dragX=null}); $('#stage').addEventListener('pointercancel',()=>{dragX=null}); addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1)}); send('request',{});})();</script></body></html>
